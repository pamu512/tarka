# Shared CodeQL configuration (advanced workflow + optional default-setup use).
#
# v1.3 layout: active Python/JS/Actions code lives under services/, frontend/,
# packages/, infra/scripts/, and .github/workflows/ (legacy_attic/ removed).
#
# Kotlin/Android: packages/fraud-sdk-android/ has no root Gradle project — exclude
# so default java-kotlin setup does not require a top-level build.
name: Tarka CodeQL config

paths:
  - .github
  - crates
  - frontend
  - services
  - packages
  - infra/scripts
  - scripts
  - schemas
  - tools
  - adapters

paths-ignore:
  - packages/fraud-sdk-android
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.cache/**"
  - infrastructure/certs/dev/**
  - docs/site/**
  # Git submodule (separate repo); enable recursive checkout in codeql.yml to scan.
  - tools/shadow/**
