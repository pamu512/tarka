name: Security scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}
  schedule:
    # Weekly full scan (UTC)
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy (repo filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Debian/Alpine often report unfixed distro CVEs; omitting them avoids flooding
          # Security → Code scanning with issues that have no upstream fix yet.
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Human-readable summary (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
        continue-on-error: true

  trivy-core-api-image:
    name: Trivy core-api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: services/core-api/Dockerfile
          load: true
          tags: tarka/core-api:scan
          push: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tarka/core-api:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
        continue-on-error: true

      - name: Trivy image python package table
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tarka/core-api:scan
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          scanners: vuln
        continue-on-error: true

      - name: Locate phantom setuptools/msgpack findings
        run: |
          set -euo pipefail
          docker run --rm tarka/core-api:scan bash -lc '
            echo "== pip =="; python -c "import importlib.metadata as m; print(m.version(\"setuptools\"), m.version(\"msgpack\"))"
            echo "== METADATA =="; find /usr /app /root -name METADATA 2>/dev/null | grep -Ei "setuptools|msgpack" || true
            echo "== version strings =="; grep -RsnE "70\.3\.0|Name: msgpack|Name: setuptools" /usr/local/lib/python3.12/site-packages /app 2>/dev/null | head -80 || true
          '
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp v0.70.0
          /tmp/trivy image --format json --quiet --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed tarka/core-api:scan > /tmp/trivy-core.json
          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/trivy-core.json").read_text())
          for res in data.get("Results") or []:
            vulns = res.get("Vulnerabilities") or []
            hit = [v for v in vulns if (v.get("PkgName") or "").lower() in {"setuptools", "msgpack"}]
            if not hit:
              continue
            print("TARGET", res.get("Target"), "CLASS", res.get("Class"), "TYPE", res.get("Type"))
            for v in hit:
              keys = ("VulnerabilityID", "PkgName", "InstalledVersion", "PkgPath", "PkgIdentifier", "Layer")
              print({k: v.get(k) for k in keys})
          PY
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-core-api
