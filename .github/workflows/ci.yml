        working-directory: services/feature-service
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-feature-service
          path: services/feature-service/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/feature-service/coverage.xml
          flags: feature-service
          fail_ci_if_error: false

  test-ml-scoring:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml-scoring/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" sqlalchemy
        working-directory: services/ml-scoring
      - name: Run tests
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=64 tests/
        working-directory: services/ml-scoring
        env:
          PYTHONPATH: src:.:../shared:../../packages/shared-core
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ml-scoring
          path: services/ml-scoring/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/ml-scoring/coverage.xml
          flags: ml-scoring
          fail_ci_if_error: false

  benchmark-latency-evaluate:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - name: Start lite stack for benchmark
        run: docker compose -f infra/deploy/docker-compose.lite.yml up -d --build
      - name: Wait for core-api (decision) health
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:8000/decisions/v1/health"
          for _ in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=3) as r:
                      body = json.loads(r.read().decode())
                      if r.status == 200 and body.get("status") == "ok":
                          print("core-api decision plane ready")
                          raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(2)
          raise SystemExit("core-api decision plane did not become ready")
          PY
      - name: Run latency benchmark and capture output
        run: |
          python3 scripts/benchmarks/latency_evaluate.py \
            --url http://127.0.0.1:8000/decisions \
            --requests 300 \
            --concurrency 30 \
            --warmup 20 | tee benchmark-latency-evaluate.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-latency-evaluate
          path: benchmark-latency-evaluate.txt
          if-no-files-found: error
      - name: Tear down stack
        if: always()
        run: docker compose -f infra/deploy/docker-compose.lite.yml down -v --remove-orphans

  chaos-matrix:
    needs: audit-stubs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fault: [redis, postgres]
    steps:
      - uses: actions/checkout@v7
      - name: Run chaos smoke
        run: python3 scripts/chaos/chaos_smoke.py --profile core --fault ${{ matrix.fault }}

  schema-registry-compat:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Event schema registry compatibility gate
        run: python3 infra/scripts/ci/schema_registry_compat.py

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - audit-stubs
      - lint
      - test-shared-auth
      - test-decision-api
      - test-case-api
      - test-graph-service
      - test-graph-neo4j-live
      - test-integration-ingress
      - test-investigation-agent
      - test-investigation-agent-golden-matrix
      - test-collaboration-chat-bridge
      - test-orchestrator-gates
      - test-sdk
      - build-frontend
      - build-sdk-typescript
      - test-graphql-gateway
      - test-data-plane
      - test-chitragupta
      - test-feature-service
      - test-ml-scoring
      - benchmark-latency-evaluate
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-api
          - signal-api
          - graph-service
          - investigation-agent
          - integration-ingress
          - data-plane
          - graphql-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: tarka/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # End-to-end: build and start every service in infra/deploy/docker-compose.yml (--profile full),
  # wait for health + POST /v1/decisions/evaluate, run follow-up smoke checks, then tear down.
  stack-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Full stack smoke (Docker Compose profile full)
        env:
          DOCKER_BUILDKIT: "1"
        run: python3 infra/scripts/ci/full_stack_smoke.py --wait-seconds 1200 --keep-up
      - name: Service contract tests
        run: python3 infra/scripts/ci/test_service_contracts.py
      - name: Traceparent propagation smoke (decision/case/investigation-agent)
        run: python3 infra/scripts/ci/traceparent_smoke.py --allow-missing
      - name: Tear down full stack
        if: always()
        run: python3 infra/scripts/ci/full_stack_smoke.py --down-only

  cloud-preset-smoke:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Helm lint supported deployment charts
        run: |
          for chart in fraud-stack tarka fraud-stack-lite; do
            helm lint "infra/deploy/helm/${chart}"
          done
      - name: Helm template supported deployment charts (default values)
        run: |
          for chart in fraud-stack tarka fraud-stack-lite; do
            helm template "tarka-${chart}" "infra/deploy/helm/${chart}" \
              -f "infra/deploy/helm/${chart}/values.yaml" >"/tmp/tarka-${chart}-default.yaml"
          done
      - name: Validate cloud preset generation
        run: python3 infra/scripts/ci/cloud_preset_smoke.py
      - name: Helm template (generated core-on-aws preset)
        run: |
          python3 infra/scripts/deploy/generate_cloud_values.py \
            --preset core-on-aws \
            --image-registry registry.example.com/tarka \
            --db-url 'postgresql+asyncpg://fraud:pw@db.internal:5432/fraud' \
            --redis-url 'redis://redis.internal:6379/0' \
            --output /tmp/core-on-aws.values.yaml
          helm template tarka infra/deploy/helm/fraud-stack -f /tmp/core-on-aws.values.yaml >/tmp/tarka-core-aws.yaml
