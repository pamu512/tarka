# Optional: set repository secret CODECOV_TOKEN for https://codecov.io PR coverage comments.
# Upload steps use continue-on-error so CI stays green without a token.
name: CI

# Shared auth fails closed when API_KEYS and OIDC are unset. Do not set non-empty API_KEYS here:
# configured keys require X-API-Key on every request; pytest TestClient calls usually omit it.
# Insecure dev mode lets tests reach route handlers without headers (see per-service conftests).
# Force empty keys/issuer so org/repo env cannot preconfigure auth and cause 401 in unit tests.
env:
  ALLOW_INSECURE_NO_AUTH: "true"
  API_KEYS: ""
  OIDC_ISSUER: ""

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier-1 Honesty: AST-only gate (stdlib). All test / lint jobs `need` this so nothing runs until it passes.
  audit-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tier-1 Honesty gate — no stub APIs or empty implementations (AST)
        run: python3 scripts/audit_stubs.py
      - name: Tier-1 Honesty gate — audit_stubs self-test (stdlib unittest)
        run: python3 infra/scripts/ci/test_audit_stubs.py

  lint:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.22
      - run: ruff check .
      - run: ruff format --check services/
      - name: Enforce Python import style consistency
        run: python infra/scripts/ci/check_import_style_consistency.py
      - name: Demo vertical contract unit tests (stdlib)
        run: python3 infra/scripts/ci/test_demo_vertical_contracts.py
      - name: Q2 Wave 4 contract unit tests (stdlib)
        run: |
          pip install pyyaml
          python3 infra/scripts/ci/test_q2_wave4_contracts.py
      - name: Validate JSON rule packs (policy-as-code gate)
        run: |
          pip install pydantic
          python infra/scripts/policy/validate_rule_packs.py
      - name: Validate OPA policy bundle (Q1-E01)
        run: python infra/scripts/policy/validate_opa_bundle.py
      - name: Validate default deployment profile manifest drift (Q1-E01)
        run: |
          pip install pyyaml
          python infra/scripts/policy/validate_deployment_profile_manifest.py
      - name: Validate typology DSL + predicate registry (OSS #46)
        run: python infra/scripts/policy/validate_typology_dsl.py
      - name: Validate deployment env contract (Q1-E07)
        run: python3 infra/scripts/deploy/validate_env_contract.py
      - name: Validate release governance checklist (Q1-E06)
        run: |
          pip install pyyaml
          python3 scripts/release/validate_governance_checklist.py
      - name: tarka-deploy-settings schema gate (Q1-E07)
        run: |
          pip install -e packages/deploy-settings pytest
          pytest packages/deploy-settings/tests -q
      - name: Validate OpenAPI contracts (contracts/openapi)
        run: |
          pip install pyyaml openapi-spec-validator
          python infra/scripts/ci/validate_openapi_yaml.py
      - name: Validate ML signal catalogs vs heuristic FEATURE_ORDER
        run: python scripts/ml/validate_signal_catalogs.py
      - name: ML promotion policy YAML/JSON sync + metadata (OSS #37 / #52)
        run: |
          pip install pyyaml
          python scripts/ml/validate_ml_promotion_policy.py --check-sync --strict
      - name: Lint Prometheus SLO burn rules (Q1-E04)
        run: |
          curl -sLO https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar xzf prometheus-2.53.0.linux-amd64.tar.gz prometheus-2.53.0.linux-amd64/promtool
          ./prometheus-2.53.0.linux-amd64/promtool check rules infra/deploy/observability/prometheus-rules/slo-burn.yml
      - name: Block vendor IDE tokens in tracked sources
        run: |
          python << 'PY'
          import subprocess, sys
          tokens = ("C" + "ursor", "A" + "nysphere")
          for token in tokens:
              r = subprocess.run(
                  [
                      "git",
                      "grep",
                      "-nFI",
                      token,
                      "--",
                      ".",
                      ":(exclude).github/workflows/ci.yml",
                      ":(exclude)**/target",
                  ],
                  capture_output=True,
                  text=True,
              )
              if r.returncode == 0:
                  print(r.stdout, end="")
                  print("Remove vendor-specific editor references (see CONTRIBUTING.md).", file=sys.stderr)
                  sys.exit(1)
              if r.returncode not in (0, 1):
                  sys.exit(r.returncode)
          PY

  test-shared-auth:
    needs: audit-stubs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant_binding_required: [true, false]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest fastapi httpx sqlalchemy
      - name: Shared auth + tenant binding regression (TENANT_BINDING_REQUIRED=${{ matrix.tenant_binding_required }})
        run: pytest -v tests/
        working-directory: services/shared
        env:
          PYTHONPATH: .:../../packages/shared-core
          TENANT_BINDING_REQUIRED: ${{ matrix.tenant_binding_required }}
      - name: Tenant binding smoke (Q1-E02)
        run: python3 scripts/security/tenant_binding_smoke.py --tenant-binding-required ${{ matrix.tenant_binding_required }}

  test-decision-api:
    needs: audit-stubs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/legacy_v1_decision_api/pyproject.toml
      - name: Build and install rule engine
        run: |
          pip install "maturin>=1.7,<2.0"
          maturin build --release --out dist
          pip install dist/*.whl
        working-directory: services/rule-engine
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/legacy_v1_decision_api
      - name: Run tests (inference, replay, evaluate path, consortium, rules)
        run: >
          pytest
          -m "not contract"
          --cov=decision_api
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=48
          tests/
        working-directory: services/legacy_v1_decision_api
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
          DATABASE_URL: sqlite+aiosqlite:///
          REDIS_URL: redis://localhost:6379/0
      - name: Q2 Wave 4 decision-api tests
        run: >
          pytest services/decision-api/tests/test_q2_wave4_api.py -q
        env:
          PYTHONPATH: services/decision-api/src:services/shared:packages/shared-core
          DATABASE_URL: sqlite+aiosqlite:///
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-decision-api
          path: services/legacy_v1_decision_api/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/legacy_v1_decision_api/coverage.xml
          flags: decision-api
          fail_ci_if_error: false

  test-case-api:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/case-api/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/case-api
      - name: Run tests
        run: pytest --cov=case_api --cov-report=xml --cov-report=term-missing --cov-fail-under=40 tests/
        working-directory: services/case-api
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-case-api
          path: services/case-api/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/case-api/coverage.xml
          flags: case-api
          fail_ci_if_error: false

  test-graph-service:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/graph-service/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/graph-service
      - name: Run tests (algorithms + Neo4j driver mocks)
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=26 tests/
        working-directory: services/graph-service
        env:
          PYTHONPATH: src:.:../shared
          GRAPH_BACKEND: neo4j
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-graph-service
          path: services/graph-service/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/graph-service/coverage.xml
          flags: graph-service
          fail_ci_if_error: false

  test-graph-neo4j-live:
    needs: audit-stubs
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/graphcipass2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/graph-service/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/graph-service
      - name: Wait for Neo4j Bolt
        run: |
          python <<'PY'
          import time
          from neo4j import GraphDatabase
          # Job runs on the VM (not a job container): reach the service via mapped localhost.
          uri = "bolt://127.0.0.1:7687"
          auth = ("neo4j", "graphcipass2026")
          for i in range(45):
              try:
                  d = GraphDatabase.driver(uri, auth=auth)
                  d.verify_connectivity()
                  d.close()
                  print("neo4j ready")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j did not become ready in time")
          PY
      - name: Run Neo4j integration tests
        run: pytest -v tests/test_neo4j_integration.py
        working-directory: services/graph-service
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
          NEO4J_INTEGRATION: "1"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: graphcipass2026

  test-integration-ingress:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/integration-ingress/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/integration-ingress
      - name: Run tests (OSINT parallel enrichment, KMS stubs)
        run: pytest --cov=integration_ingress --cov-report=xml --cov-report=term-missing --cov-fail-under=35 tests/
        working-directory: services/integration-ingress
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-ingress
          path: services/integration-ingress/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/integration-ingress/coverage.xml
          flags: integration-ingress
          fail_ci_if_error: false

  test-investigation-agent:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/investigation-agent/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" sqlalchemy
        working-directory: services/investigation-agent
      - name: Validate active OKF shared bundle
        run: >
          python services/investigation-agent/scripts/validate_okf_bundle.py
          knowledge/shared --scope shared
      - name: OKF parser, registry, exporter, retrieval, and end-to-end gates
        run: |
          pytest -q \
            services/investigation-agent/tests/test_okf_parser.py \
            services/investigation-agent/tests/test_okf_registry.py \
            services/investigation-agent/tests/test_okf_exporters.py \
            services/investigation-agent/tests/test_okf_retrieval.py \
            services/investigation-agent/tests/test_okf_end_to_end.py
        env:
          PYTHONPATH: services/investigation-agent/src:services/shared:packages/shared-core
      - name: Run tests
        run: pytest --cov=investigation_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=52 -m "not golden_profile" tests/
        working-directory: services/investigation-agent
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
      - name: Copilot eval golden gate (Q2-E02)
        run: pytest -v tests/test_copilot_eval_golden.py
        working-directory: services/investigation-agent
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-investigation-agent
          path: services/investigation-agent/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/investigation-agent/coverage.xml
          flags: investigation-agent
          fail_ci_if_error: false

  test-investigation-agent-golden-matrix:
    needs: audit-stubs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, no_graph, no_case, no_decision, case_only, legacy_visible]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/investigation-agent/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" sqlalchemy
        working-directory: services/investigation-agent
      - name: Golden profile ${{ matrix.profile }}
        run: >
          pytest -m golden_profile
          "tests/test_integration_golden_profiles.py::test_golden_profile_integration_surface[${{ matrix.profile }}]"
          -v --tb=short
        working-directory: services/investigation-agent
        env:
          PYTHONPATH: src:../shared:../../packages/shared-core

  test-collaboration-chat-bridge:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/collaboration-chat-bridge/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: services/collaboration-chat-bridge
      - name: Q2-E08 bidirectional case actions gate
        run: pytest -v tests/
        working-directory: services/collaboration-chat-bridge
        env:
          PYTHONPATH: .:src:../shared
          # Override workflow default: Q2-E08 asserts bridge secret auth (401 without headers).
          ALLOW_INSECURE_NO_AUTH: "false"

  test-orchestrator-gates:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install orchestrator test dependencies
        run: |
          pip install pytest pytest-asyncio fastapi httpx sqlalchemy aiosqlite redis pydantic pydantic-settings duckdb neo4j reportlab pypdf python-multipart greenlet protobuf maturin
          pip install -e packages/deploy-settings
          (cd crates/tarka-py && maturin build --release --out /tmp/tarka-wheels && pip install /tmp/tarka-wheels/*.whl)
      - name: Q2-E04 entity resolution + HIL override gates
        run: |
          pytest -q \
            tests/test_entity_resolution_gate.py \
            tests/test_hil_overrides_contract_gate.py \
            tests/test_entity_profile_gate.py
        working-directory: services/orchestrator
        env:
          PYTHONPATH: >-
            .:../../packages/shared-core:../rule_engine:../ingestor/src:../ingestor
          ORCHESTRATOR_ENTITY_PROFILE_SKIP_SHADOW: "1"
          ORCHESTRATOR_V1_RATE_LIMIT_RPM: "0"
          ALLOW_INSECURE_NO_AUTH: "true"

  test-sdk:
    needs: audit-stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/fraud-sdk-python/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: packages/fraud-sdk-python
      - name: Run tests
        run: pytest --cov=fraud_stack_sdk --cov-report=xml --cov-report=term-missing --cov-fail-under=48 tests/
        working-directory: packages/fraud-sdk-python
        env:
          PYTHONPATH: src
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fraud-sdk-python
          path: packages/fraud-sdk-python/coverage.xml
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/fraud-sdk-python/coverage.xml
          flags: fraud-sdk-python
          fail_ci_if_error: false

  build-frontend:
    needs: audit-stubs
    runs-on: ubuntu-latest
    env:
      # Deterministic Vite/tsc memory on CI runners (avoids flaky OOM on `vite build`).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test -w tarka-ui
      - name: Guard production build mock mode
        run: python infra/scripts/ci/check_frontend_mock_mode.py
      - run: npm run build -w tarka-ui

  build-sdk-typescript:
    needs: audit-stubs
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/fraud-sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: packages/fraud-sdk-typescript
      - run: npm test
        working-directory: packages/fraud-sdk-typescript
      - run: npm run test:contract
        working-directory: packages/fraud-sdk-typescript
      - run: npm run build
        working-directory: packages/fraud-sdk-typescript

