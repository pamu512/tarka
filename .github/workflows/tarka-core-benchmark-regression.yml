# Criterion micro-benchmarks for `tarka-core` (manual / release checks).
# PR gate for Criterion p99 ratio is `.github/workflows/bench.yml` only (ROI #10).
# - Job 1: absolute Baseline vs Proposed p99 delta — `infra/scripts/ci/latency_violation_report.py`
# - Job 2: p99 vs origin/master ratio — `infra/scripts/ci/criterion_p99_regression.py`
name: tarka-core benchmark regression

on:
  workflow_dispatch:

concurrency:
  group: tarka-core-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  latency-guard-p99-delta:
    name: Baseline vs Proposed p99 delta (max +100 µs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + workspace target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-tarka-core-latency-guard

      - name: Run Baseline vs Proposed benchmarks + enforce absolute p99 delta
        env:
          CI: "true"
          TARKA_LG_BASELINE_LEAVES: "120"
          TARKA_LG_PROPOSED_LEAVES: "120"
        run: |
          set -euo pipefail
          cargo bench -p tarka-core --bench rule_set_latency_guard --locked
          python3 infra/scripts/ci/latency_violation_report.py \
            --group-dir target/criterion/rule_set_latency_guard \
            --baseline-fn baseline_evaluate \
            --proposed-fn proposed_evaluate \
            --max-delta-us 100

  criterion-p99:
    name: Criterion p99 vs master (5% max)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + workspace target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-tarka-core-bench

      - name: Fetch master (baseline ref)
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Save tip SHA
        run: echo "TIP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Benchmark baseline (origin/master)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          git checkout --detach origin/master
          cargo bench -p tarka-core --bench standard_heavy_rule_set --locked -- --save-baseline master

      - name: Benchmark tip + enforce p99 regression bound
        env:
          CI: "true"
        run: |
          set -euo pipefail
          git checkout --detach "${TIP_SHA}"
          cargo bench -p tarka-core --bench standard_heavy_rule_set --locked
          python3 infra/scripts/ci/criterion_p99_regression.py \
            --benchmark-dir target/criterion/standard_heavy_rule_set/evaluate_full_trace \
            --baseline-label master \
            --max-ratio 1.05
