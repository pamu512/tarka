# V2 ingestion sidecars: Rule Engine, Shadow Agent, Orchestrator (+ shared ingestor).
# Lint runs before tests so a deliberate ruff violation fails the job before pytest starts.
#
# Gate (manual): on a throwaway branch, introduce a ruff error (e.g. unused import) under
# services/{rule_engine,shadow_agent,orchestrator,ingestor}/, push, open PR —
# the "Ruff" step must fail; pytest steps must not run (skipped after failure).
#
# Trivy gate: uncomment ``urllib3==1.25.11`` in ``services/orchestrator/requirements.txt``,
# push to a branch — the container-scan job must fail before merge.
name: Tarka V2 Sidecars CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tarka-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v2-sidecars:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            services/orchestrator/pyproject.toml
            services/rule_engine/pyproject.toml
            services/shadow/pyproject.toml
            services/saarthi/pyproject.toml
            services/shadow_agent/pyproject.toml

      - name: Install tooling and editable sidecars
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-asyncio openai psutil protobuf maturin
          # Install shared package first (file: deps in sidecar pyprojects resolve from repo root).
          pip install -e ./packages/deploy-settings
          pip install -e "./services/shadow[dev]"
          (cd crates/tarka-py && maturin build --release --out /tmp/tarka-wheels && pip install /tmp/tarka-wheels/*.whl)
          (cd services/rule_engine && pip install -e .)
          (cd services/orchestrator && pip install -e ".[janus,dev]")
          pip install fakeredis
          pip install -e "./services/saarthi[dev]"
          (cd services/shadow_agent && pip install -e .)

      - name: Ruff (sidecars + ingestor)
        run: |
          ruff check \
            services/rule_engine \
            services/shadow \
            services/shadow_agent \
            services/orchestrator \
            services/saarthi \
            services/ingestor

      - name: Black
        if: matrix.python-version == '3.14'
        run: |
          black --check --line-length 100 --target-version py312 --fast \
            services/rule_engine \
            services/shadow \
            services/shadow_agent \
            services/orchestrator \
            services/saarthi \
            services/ingestor

      - name: Pytest — Rule Engine
        working-directory: services/rule_engine
        env:
          PYTHONPATH: .:../ingestor/src:../ingestor:../shared:../../packages/shared-core
        run: pytest tests -q

      - name: Pytest — Orchestrator
        working-directory: services/orchestrator
        env:
          PYTHONPATH: .:..:../ingestor/src:../ingestor:../shared:../../packages/shared-core:../rule_engine:../shadow_agent
        run: pytest tests -q

      - name: Pytest — Shadow (hooks + NATS tools)
        working-directory: services/shadow
        env:
          PYTHONPATH: ${{ github.workspace }}/services
        run: pytest tests -q

      - name: Pytest — Shadow Agent
        working-directory: services/shadow_agent
        env:
          PYTHONPATH: .:../ingestor/src:../ingestor:../../packages/shared-core:..
          SHADOW_API_KEY: ci-placeholder-not-for-production
        run: pytest tests -q

      - name: Pytest — Saarthi (SAR PDF)
        working-directory: services/saarthi
        run: pytest tests -q

  # Multi-stage Dockerfiles under services/*/Dockerfile — scan after lint+tests pass.
  container-scan:
    name: Container images (Trivy)
    runs-on: ubuntu-latest
    needs: v2-sidecars
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sidecar images
        run: |
          set -eux
          docker build -f services/orchestrator/Dockerfile -t tarka-orchestrator:ci .
          docker build -f services/rule_engine/Dockerfile -t tarka-rule-engine:ci .
          docker build -f services/shadow_agent/Dockerfile -t tarka-shadow-agent:ci .

      - name: Trivy — Orchestrator
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tarka-orchestrator:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"
          hide-progress: "true"

      - name: Trivy — Rule Engine
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tarka-rule-engine:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"
          hide-progress: "true"

      - name: Trivy — Shadow Agent
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tarka-shadow-agent:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"
          hide-progress: "true"
