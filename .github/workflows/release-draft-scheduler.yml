# Release Draft Scheduler

# Maintains a single honest pre-release draft from docs — not calendar boilerplate.
name: Release Draft Scheduler

on:
  schedule:
    - cron: "15 8 * * 1" # weekly Monday
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync v1.3.0-beta draft from release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=docs/docs/releases/v1.3.0-beta.md
          test -f "$NOTES"
          # Update existing draft if present; else create
          if gh release view v1.3.0-beta >/dev/null 2>&1; then
            gh release edit v1.3.0-beta \
              --draft \
              --prerelease \
              --title "Tarka 1.3.0-beta" \
              --notes-file "$NOTES" \
              --target master
          elif gh release view v1.3.0 >/dev/null 2>&1; then
            # Migrate legacy untagged v1.3.0 draft → beta notes
            gh release edit v1.3.0 \
              --draft \
              --prerelease \
              --title "Tarka 1.3.0-beta" \
              --notes-file "$NOTES" \
              --tag v1.3.0-beta \
              --target master
          else
            gh release create v1.3.0-beta \
              --draft \
              --prerelease \
              --title "Tarka 1.3.0-beta" \
              --notes-file "$NOTES" \
              --target master
          fi
