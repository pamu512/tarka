# Focused policy-as-code job (same checks as `make policy-check` / audit-stubs).
name: policy-check

on:
  pull_request:
  push:
    branches: [master, main]
    paths:
      - "services/decision-api/rules/**"
      - "services/rule_engine/**"
      - "infra/scripts/policy/**"
      - "infra/opa/**"
      - "Makefile"
      - ".github/workflows/policy-check.yml"

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators deps
        run: pip install pydantic sqlalchemy
      - name: make policy-check
        run: make policy-check
