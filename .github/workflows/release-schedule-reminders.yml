# Stale calendar reminders removed — GA date is CI-gated, not June 2026 fiction.
# Use the 1.3.0-beta notes + stack-smoke for release readiness.
name: Release Schedule Reminders

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (no automatic milestone spam)"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: No scheduled reminders
        run: |
          echo "Release readiness: docs/docs/releases/v1.3.0-beta.md + green stack-smoke."
          echo "Input: ${{ github.event.inputs.note }}"
