# Dependency updates. PRs are gated: open-pull-requests-limit stays 0 on master
# unless .github/workflows/dependabot-gate.yml enables it for an active week
# (non-bot commits on master in the last 7 days). Quiet weeks → skip (no new branches).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/decision-api
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-decision-api:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/core
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-core:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/analytics
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-analytics:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/case-api
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-case-api:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/graph-service
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-graph-service:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/integration-ingress
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-integration-ingress:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/investigation-agent
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-investigation-agent:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      npm-frontend:
        patterns:
          - "*"
    ignore:
      # Major frontend bumps need a dedicated upgrade pass (see closed PR #232/#238).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
