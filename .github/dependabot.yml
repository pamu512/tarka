# Dependency updates (opens PRs weekly). Review Trivy + CI before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/decision-api
    schedule:
      interval: weekly
    groups:
      pip-decision-api:
        patterns:
          - "*"

  # DEPRECATED (one release cycle): legacy_v1_decision_api — dependabot frozen; use decision-api above.
  - package-ecosystem: pip
    directory: /services/legacy_v1_decision_api
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /services/core
    schedule:
      interval: weekly
    groups:
      pip-core:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/analytics
    schedule:
      interval: weekly
    groups:
      pip-analytics:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/case-api
    schedule:
      interval: weekly
    groups:
      pip-case-api:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/graph-service
    schedule:
      interval: weekly
    groups:
      pip-graph-service:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/integration-ingress
    schedule:
      interval: weekly
    groups:
      pip-integration-ingress:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/investigation-agent
    schedule:
      interval: weekly
    groups:
      pip-investigation-agent:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-frontend:
        patterns:
          - "*"
    ignore:
      # Major frontend bumps need a dedicated upgrade pass (see closed PR #232/#238).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
