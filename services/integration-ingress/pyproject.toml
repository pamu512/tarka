[project]
name = "tarka-integration-ingress"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "structlog>=26.1.0",
  "tarka-core @ file:../core",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "httpx>=0.28.1",
  "nats-py>=2.16.0",
  "redis[hiredis]>=8.1.0",
  "boto3>=1.43.98",
  "google-cloud-kms>=3.17.0",
  "azure-identity>=1.25.3",
  "azure-keyvault-keys>=4.11.2",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.54",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
