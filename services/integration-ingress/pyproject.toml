[project]
name = "tarka-integration-ingress"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "structlog>=26.1.0",
  "tarka-core @ file:../core",
  "tarka-vendor-finops @ file:../integration",
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.50.2",
  "httpx>=0.28.1",
  "nats-py>=2.15.0",
  "redis[hiredis]>=8.0.1",
  "boto3>=1.43.41",
  "google-cloud-kms>=3.14.0",
  "azure-identity>=1.25.3",
  "azure-keyvault-keys>=4.11.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.51",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "alembic>=1.18.5",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
