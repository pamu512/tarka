[project]
name = "tarka-investigation-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.3",
  "structlog>=26.1.0",
  "fastapi>=0.141.1",
  "fpdf2>=2.8.7",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.52.0",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "psycopg[binary]>=3.2.0",
  "tarka-collaboration-chat-bridge @ file:../collaboration-chat-bridge",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigation_agent = ["workflows/manifests/*.json", "resources/*.json"]

