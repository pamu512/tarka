[project]
name = "tarka-investigation-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.3",
  "structlog>=26.1.0",
  "fastapi>=0.162.0",
  "fpdf2>=2.9.0",
  "python-multipart>=0.0.33",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "psycopg[binary]>=3.3.8",
  "tarka-collaboration-chat-bridge @ file:../collaboration-chat-bridge",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigation_agent = ["workflows/manifests/*.json", "resources/*.json"]

