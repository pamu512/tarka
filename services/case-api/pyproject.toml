[project]
name = "tarka-case-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "structlog>=26.1.0",
  "tarka-core @ file:../core",
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.8",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.32.0",
  "psycopg[binary]>=3.3.8",
  "alembic>=1.20.1",
  "httpx>=0.28.1",
  "pydantic-settings>=2.16.2",
  "pydantic>=2.14.3",
  "paramiko>=5.1.0",
  "bleach>=6.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "pytest-cov>=7.1.0", "httpx>=0.28.1"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]

