[project]
name = "tarka-graph-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "structlog>=26.1.0",
  "fastapi>=0.138.2",
  "uvicorn[standard]>=0.49.0",
  "neo4j>=6.2.0",
  "gremlinpython>=3.8.1",
  "networkx>=3.6.1",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.13.4",
  # auth_rbac (imported for require_role) imports httpx at module load; Docker uses non-dev install.
  "httpx>=0.28.1",
  "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]

# JanusGraph/Gremlin backends are optional; default CI only exercises Neo4j algorithm paths.
# Omitting them keeps --cov-fail-under meaningful without requiring a live Janus in unit tests.
[tool.coverage.run]
omit = [
  "*/graph_service/algorithms_janus.py",
  "*/graph_service/janusgraph_store.py",
  "*/graph_service/janusgraph_gremlin.py",
]
