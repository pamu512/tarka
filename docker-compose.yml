# One compose front door (same as README / docs/INDEX.md):
#
#   docker compose \
#     -f infra/deploy/docker-compose.lite.yml \
#     -f infra/deploy/docker-compose.fraud-desk.yml \
#     up --build
#
# `docker compose up` from the repo root includes those two files.
# Optional laptop Ollama overlay: -f docker-compose.local.yml
# Lab / legacy files live under infra/deploy/archive/.

include:
  - path: infra/deploy/docker-compose.lite.yml
  - path: infra/deploy/docker-compose.fraud-desk.yml
