# Default local stack = Tarka Lite (core-api → decision-api evaluate).
#
# Usage (repo root):
#   docker compose up --build
#   ./scripts/bootstrap_beta.sh --launch
#
# Deprecated speed-layer (core_v2 + Redis streams ML / batch copilot):
#   docker compose -f docker-compose.streams-ai.yml up --build
#
# Orchestrator ingest rail (decision-api + shadow_agent + optional Python rules):
#   docker compose -f infra/deploy/docker-compose.v2-ingest.yml up --build

include:
  - path: infra/deploy/docker-compose.lite.yml
