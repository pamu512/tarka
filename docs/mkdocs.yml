site_name: "Tarka Documentation"
site_description: "Modular, source-available fraud detection — real-time decisions, graph, cases, and local-first forensics."
site_url: https://tarka.dev

repo_name: pamu512/tarka
repo_url: https://github.com/pamu512/tarka

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Feature data flows: guides/feature-data-flows.md
  - Services:
      - Decision API: services/decision-api.md
      - Case API: services/case-api.md
      - Graph Service: services/graph-service.md
      - Feature / ML (signal): services/feature-service.md
      - Investigation Agent: services/investigation-agent.md
  - Guides:
      - Productionization (AI/ops): guides/repo-productionization-runbook.md
      - Deployment: guides/deployment.md
      - Service ports: guides/service-ports.md
      - Ingest & replay: guides/ingest-replay-onboarding.md
      - Graph analysis: guides/graph-analysis.md
      - Decision context graph: guides/decision-context-graph.md
      - Observe & A/B: guides/shadow-and-ab-testing.md
      - Auth vs forensics path: guides/auth-vs-forensics-path.md
      - Degraded operations: guides/degraded-operations.md
      - Incident response: guides/incident-response.md
      - Calibration ops: guides/calibration-ops-runbook.md
      - Rules: guides/rules.md
      - Backtest before promote: guides/backtest-before-promote.md
      - OSS 15-minute first decision: guides/oss-15-minute-first-decision.md
  - Releases:
      - 1.3.0-beta: releases/v1.3.0-beta.md
      - Releases hub: releases/README.md

  - API Reference: api-reference.md
  - Operations:
      - SRE Compose profiles: operations/sre-compose-profiles.md
      - Runbook index: operations/runbook-pack-index.md
      - Common failures: operations/runbook-common-failures.md
      - On-call: operations/oncall-playbook.md
      - SLO burn: operations/slo-burn-response.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pamu512/tarka
  generator: false
