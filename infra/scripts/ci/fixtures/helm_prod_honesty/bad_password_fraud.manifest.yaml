# One G1 fail class only. --self-check must report chart-default password fraud.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarka-tarka-age-postgres
spec:
  template:
    spec:
      containers:
        - name: age-postgres
          env:
            - name: POSTGRES_PASSWORD
              value: "fraud"
            - name: DATABASE_URL
              value: "postgresql://fraud:fraud@tarka-tarka-age-postgres:5432/fraud"
