# One G1 fail class only. --self-check must report TREND durable-path failure.
# No .sqlite filename here so a blind sqlite-only regex is not enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarka-tarka-core-api
spec:
  template:
    spec:
      containers:
        - name: core-api
          env:
            - name: TREND_AGENT_DATA_DIR
              value: "/var/trend-agent"
            - name: TREND_AGENT_DB_NAME
              value: "trend_agent"
