# Intentionally dishonest production-shaped render. helm_prod_honesty.sh
# --self-check MUST fail this fixture. Do not use as a real overlay.
# Covers G1 fail classes: sqlite / TREND sqlite path, durable emptyDir,
# in-cluster core Postgres, chart-default password fraud.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarka-tarka-core-api
spec:
  template:
    spec:
      containers:
        - name: core-api
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////data/tarka.sqlite"
            - name: TARKA_AUDIT_DATABASE_URL
              value: "sqlite+aiosqlite:////data/audit.sqlite"
            - name: TREND_AGENT_DATA_DIR
              value: "/var/trend-agent"
            - name: TREND_AGENT_DB_NAME
              value: "trend_agent.sqlite3"
            - name: INVESTIGATION_STORE
              value: "sqlite"
      volumes:
        - name: audit-data
          emptyDir: {}
        - name: pack-store
          emptyDir: {}
        - name: label-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarka-tarka-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_PASSWORD
              value: "fraud"
      volumes:
        - name: data
          emptyDir: {}
