# Fraud desk Day-1 profile (missed-mark bridge Track A4)
#
# From repository root:
#   docker compose \
#     -f infra/deploy/docker-compose.lite.yml \
#     -f infra/deploy/docker-compose.fraud-desk.yml \
#     up --build
#
# Does NOT enable --profile graph (no JanusGraph / 24GB triad).
# Frontend: lean nav + desk-strict (no auto mock fallback on case/calibration/QA).

services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_LEAN_NAV: "true"
        VITE_DESK_STRICT: "true"
        VITE_USE_API_MOCKS: "false"
    environment:
      VITE_DESK_STRICT: "true"
      VITE_USE_API_MOCKS: "false"
