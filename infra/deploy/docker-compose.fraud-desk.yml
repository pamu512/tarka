# Thin desk overlay (evaluate-only UI) — lean nav + desk-strict.
#
# From repository root:
#   docker compose \
#     -f infra/deploy/docker-compose.lite.yml \
#     -f infra/deploy/docker-compose.fraud-desk.yml \
#     up --build
#
# Does NOT start investigation-agent, signal-api, or integration-ingress.
# Graph starts with lite (no --profile graph). Advise stays off until that overlay.
# Former ~8 GB "Desk" (agent + signals + ingress) is docker-compose.full-desk.yml.

services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_LEAN_NAV: "true"
        VITE_DESK_STRICT: "true"
        VITE_USE_API_MOCKS: "false"
        VITE_GRAPH_SERVICE_URL: /api/graph
    environment:
      VITE_DESK_STRICT: "true"
      VITE_USE_API_MOCKS: "false"
