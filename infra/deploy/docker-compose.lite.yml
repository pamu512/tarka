# Tarka Lite — evaluate + required graph (Apache AGE on the same Postgres + graph-service).
# Default services: postgres, redis, graph-service, core-api, frontend.
# Empty GRAPH_SERVICE_URL is an outage. Advise / signals stay additive overlays.
# Graph store is Apache AGE (Apache-2.0). Janus/Neo4j stay optional on other compose files.
# Existing postgres:16-alpine volumes may lack AGE preload — wipe fraud_pg if Postgres refuses to start.
#
# Usage:
#   docker compose -f infra/deploy/docker-compose.lite.yml up --build
# Thin desk (lean /decisions + /rules + residual /cases + Hunt):
#   docker compose -f infra/deploy/docker-compose.lite.yml -f infra/deploy/docker-compose.fraud-desk.yml up --build
# + investigation (Advise / copilot):
#   docker compose -f infra/deploy/docker-compose.lite.yml -f infra/deploy/docker-compose.investigation.yml up --build
# + signals (signal-api + integration-ingress + nats):
#   docker compose -f infra/deploy/docker-compose.lite.yml -f infra/deploy/docker-compose.signals.yml up --build
# Full desk (~8 GB): infra/deploy/docker-compose.full-desk.yml
# Optional async ingest (data-plane :8007 + orchestrator :8790 + outbox-processor):
#   docker compose -f infra/deploy/docker-compose.lite.yml --profile ingest up --build
# Demo vertical overlay (archived): infra/deploy/archive/docker-compose.demo-vertical.yml
# Profiles: docs/docs/operations/sre-compose-profiles.md

name: tarka-lite

services:
  # ---------- Infrastructure ----------
  postgres:
    image: apache/age:release_PG16_1.6.0
    # Overrides volume postgresql.conf so AGE loads on a reused PG16 data dir.
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - fraud_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - fraud_nats_lite:/data
    # Sync evaluate does not use NATS. Started with --profile ingest or the signals overlay.
    profiles: [ingest]

  # ---------- Core Services ----------
  core-api:
    build:
      context: ../..
      dockerfile: services/core-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      REDIS_URL: redis://redis:6379/0
      AGG_KEY_VERSION: ${AGG_KEY_VERSION:-local_v1}
      RULES_PATH: /app/rules
      FEATURE_SERVICE_URL: ${FEATURE_SERVICE_URL:-}
      ML_SCORING_URL: ${ML_SCORING_URL:-}
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://graph-service:8001}
      DECISION_GRAPH_ENABLED: ${DECISION_GRAPH_ENABLED:-true}
      NATS_URL: ${NATS_URL:-}
      OPA_URL: ""
      EDGE_SECURITY_SIGNALS_ENABLED: ${EDGE_SECURITY_SIGNALS_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-true}
      DECISION_API_URL: http://127.0.0.1:8000/decisions
      # Auto-create a case for deny/review evaluations (requires CASE_API_URL + CASE_INTERNAL_TOKEN).
      CASE_CREATE_ON_DENY_REVIEW: ${CASE_CREATE_ON_DENY_REVIEW:-false}
      CASE_API_URL: ${CASE_API_URL:-http://127.0.0.1:8000/cases}
      CASE_INTERNAL_TOKEN: ${CASE_INTERNAL_TOKEN:-}
      TREND_AGENT_DATA_DIR: /var/trend-agent
      TREND_TICK_SKIP_LLM: "1"
      TREND_BASELINE_MIN_N: "3"
    volumes:
      - trend_agent_data:/var/trend-agent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/decisions/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  graph-service:
    build:
      context: ../..
      dockerfile: services/graph-service/Dockerfile
    environment:
      GRAPH_BACKEND: age
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      DECISION_GRAPH_ENABLED: ${DECISION_GRAPH_ENABLED:-true}
      DECISION_GRAPH_JANUS_MIRROR: ${DECISION_GRAPH_JANUS_MIRROR:-true}
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-true}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  data-plane:
    build:
      context: ../..
      dockerfile: services/data-plane/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DECISION_API_URL: http://core-api:8000/decisions
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      INGEST_SCHEMA_REGISTRY_MODE: ${INGEST_SCHEMA_REGISTRY_MODE:-enforce}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-}
      CLICKHOUSE_DATABASE: fraud
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8790}
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:-}
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      core-api:
        condition: service_healthy
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 35s
    profiles: [ingest]

  # Shared fraud DB. create_all is allowlisted (tarka_outbox + shared decisions; never cases).
  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    environment:
      RULE_EVAL_BACKEND: decision_api
      DECISION_API_URL: http://core-api:8000/decisions
      ORCHESTRATOR_AUDIT_DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      ANUMANA_REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      GRAPH_BACKEND: ${GRAPH_BACKEND:-}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-}
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:-}
      SHADOW_AGENT_URL: ${SHADOW_AGENT_URL:-}
      SHADOW_API_KEY: ${TARKA_SHADOW_API_KEY:-}
    ports:
      - "8790:8790"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/full')"]
      interval: 10s
      timeout: 12s
      retries: 6
      start_period: 25s
    profiles: [ingest]

  outbox-processor:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    entrypoint: ["/usr/local/bin/python3"]
    command: ["-m", "workers.outbox_processor"]
    environment:
      ORCHESTRATOR_AUDIT_DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      ANUMANA_REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      GRAPH_BACKEND: ${GRAPH_BACKEND:-}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    profiles: [ingest]

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_GRAPH_SERVICE_URL: /api/graph
    ports:
      - "3000:80"
    depends_on:
      - core-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  fraud_pg:
  fraud_nats_lite:
  trend_agent_data:
