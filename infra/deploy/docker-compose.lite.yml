# Tarka Lite — "try it in 5 minutes" deployment
# Core: postgres, redis, core-api (decision+case), integration-ingress, frontend.
# Optional OSS path: janusgraph/janusgraph:1.0.0 (BerkeleyJE volume) + graph-service (profile: graph); signal-api is always on for core-api.
# so policy routing, typologies, velocities, and graph checkpoints work without the full stack.
#
# Usage:
#   docker compose -f infra/deploy/docker-compose.lite.yml up --build
# Optional async ingest (data-plane :8007 + orchestrator :8790 + outbox-processor):
#   docker compose -f infra/deploy/docker-compose.lite.yml --profile ingest up --build
# Optional graph evaluate read (sets GRAPH_SERVICE_URL):
#   docker compose -f infra/deploy/docker-compose.lite.yml -f infra/deploy/archive/docker-compose.graph-wire.yml --profile graph up --build
# Day-1 desk: also merge infra/deploy/docker-compose.fraud-desk.yml (see README / docs/INDEX.md).
# Demo vertical overlay (archived): infra/deploy/archive/docker-compose.demo-vertical.yml

name: tarka-lite

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - fraud_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - fraud_nats_lite:/data

  janusgraph:
    image: docker.io/janusgraph/janusgraph:1.0.0
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8182:8182"
    volumes:
      - janusgraph_data:/var/lib/janusgraph
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8182'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    profiles: [graph]

  # ---------- Core Services ----------
  core-api:
    build:
      context: ../..
      dockerfile: services/core-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      REDIS_URL: redis://redis:6379/0
      AGG_KEY_VERSION: ${AGG_KEY_VERSION:-local_v1}
      RULES_PATH: /app/rules
      FEATURE_SERVICE_URL: ${FEATURE_SERVICE_URL:-http://signal-api:8004/features}
      ML_SCORING_URL: ${ML_SCORING_URL:-http://signal-api:8004/ml}
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OPA_URL: ""
      EDGE_SECURITY_SIGNALS_ENABLED: ${EDGE_SECURITY_SIGNALS_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      DECISION_API_URL: http://127.0.0.1:8000/decisions
      TREND_AGENT_DATA_DIR: /var/trend-agent
      TREND_TICK_SKIP_LLM: "1"
      TREND_BASELINE_MIN_N: "3"
    volumes:
      - trend_agent_data:/var/trend-agent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      signal-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/decisions/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  graph-service:
    build:
      context: ../..
      dockerfile: services/graph-service/Dockerfile
    environment:
      GRAPH_BACKEND: janusgraph
      JANUSGRAPH_GREMLIN_URL: ws://janusgraph:8182/gremlin
    ports:
      - "8001:8001"
    depends_on:
      janusgraph:
        condition: service_healthy
    profiles: [graph]

  signal-api:
    build:
      context: ../..
      dockerfile: services/signal-api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      AGG_KEY_VERSION: ${AGG_KEY_VERSION:-local_v1}
      FEATURE_SERVICE_REDIS_URL: redis://redis:6379/0
      COUNTER_SERVICE_REDIS_URL: redis://redis:6379/0
      DISABLE_ML: ${DISABLE_ML:-true}
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy

  integration-ingress:
    build:
      context: ../..
      dockerfile: services/integration-ingress/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      KMS_PROVIDER: local
      KMS_ACTIVE_KEY_ID: lite-v1
      INTEGRATION_VAULT_KEY: lite-dev-key
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  data-plane:
    build:
      context: ../..
      dockerfile: services/data-plane/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DECISION_API_URL: http://core-api:8000/decisions
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      INGEST_SCHEMA_REGISTRY_MODE: ${INGEST_SCHEMA_REGISTRY_MODE:-enforce}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-}
      CLICKHOUSE_DATABASE: fraud
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8790}
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:-}
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      core-api:
        condition: service_healthy
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 35s
    profiles: [ingest]

  # Shared fraud DB. create_all is allowlisted (tarka_outbox + shared decisions; never cases).
  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    environment:
      RULE_EVAL_BACKEND: decision_api
      DECISION_API_URL: http://core-api:8000/decisions
      ORCHESTRATOR_AUDIT_DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      ANUMANA_REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      GRAPH_BACKEND: ${GRAPH_BACKEND:-}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-}
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:-}
      SHADOW_AGENT_URL: ${SHADOW_AGENT_URL:-}
      SHADOW_API_KEY: ${TARKA_SHADOW_API_KEY:-}
    ports:
      - "8790:8790"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/full')"]
      interval: 10s
      timeout: 12s
      retries: 6
      start_period: 25s
    profiles: [ingest]

  outbox-processor:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    entrypoint: ["/usr/local/bin/python3"]
    command: ["-m", "workers.outbox_processor"]
    environment:
      ORCHESTRATOR_AUDIT_DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
      ANUMANA_REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      GRAPH_BACKEND: ${GRAPH_BACKEND:-}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    profiles: [ingest]

  investigation-agent:
    build:
      context: ../..
      dockerfile: services/investigation-agent/Dockerfile
    environment:
      CASE_API_URL: http://core-api:8000/cases
      DECISION_API_URL: http://core-api:8000/decisions
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-}
      ALLOWED_ANALYSTS: ${ALLOWED_ANALYSTS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_PROVIDER_FALLBACKS: ${LLM_PROVIDER_FALLBACKS:-anthropic,gemini,ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_KEYS: ${API_KEYS:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      OKF_ENABLED: ${OKF_ENABLED:-true}
      OKF_SHARED_ROOT: /app/knowledge/shared
      OKF_TENANT_ROOT: /var/lib/tarka/knowledge/tenants
      INVESTIGATION_DATA_DIR: /var/lib/tarka/investigation-agent
    ports:
      - "8006:8006"
    volumes:
      - ${OKF_TENANT_OVERLAYS_PATH:-../../knowledge/tenants}:/var/lib/tarka/knowledge/tenants:ro
      - investigation_agent_data:/var/lib/tarka/investigation-agent
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - core-api
      - integration-ingress
      - signal-api
      - investigation-agent
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  fraud_pg:
  fraud_nats_lite:
  trend_agent_data:
  investigation_agent_data:
  janusgraph_data:
