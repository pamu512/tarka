# Wire evaluate → graph-service. Merge with lite when --profile graph is on.
#
#   docker compose -f infra/deploy/docker-compose.lite.yml \
#     -f infra/deploy/docker-compose.graph-wire.yml --profile graph up -d
#
# Ingest + graph (Janus writes from outbox; this overlay sets GREMLIN_REMOTE_URL):
#   docker compose -f infra/deploy/docker-compose.lite.yml \
#     -f infra/deploy/docker-compose.graph-wire.yml \
#     --profile graph --profile ingest up -d

name: tarka-lite

services:
  core-api:
    environment:
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://graph-service:8001}
  investigation-agent:
    environment:
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://graph-service:8001}
  orchestrator:
    environment:
      GRAPH_BACKEND: ${GRAPH_BACKEND:-janusgraph}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-ws://janusgraph:8182/gremlin}
  outbox-processor:
    environment:
      GRAPH_BACKEND: ${GRAPH_BACKEND:-janusgraph}
      GREMLIN_REMOTE_URL: ${GREMLIN_REMOTE_URL:-ws://janusgraph:8182/gremlin}
