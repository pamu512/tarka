{{- if and .Values.investigationAgent.okfTenantOverlays.enabled (not .Values.investigationAgent.okfTenantOverlays.existingClaim) }}
{{- fail "investigation-agent OKF tenant overlays require investigationAgent.okfTenantOverlays.existingClaim" }}
{{- end }}
{{- if and (eq .Values.investigationAgent.agentRunPersistence.mode "local-sqlite") (gt (int .Values.investigationAgent.replicas) 1) }}
{{- fail "investigation-agent local-sqlite persistence requires a single replica; configure an external shared AgentRun store before scaling" }}
{{- end }}
{{- if ne .Values.investigationAgent.agentRunPersistence.mode "local-sqlite" }}
{{- fail "investigation-agent chart supports agentRunPersistence.mode=local-sqlite only; use an external shared AgentRun store deployment for horizontal scaling" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-agent
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.investigationAgent.replicas }}
  selector:
    matchLabels:
      app: investigation-agent
  template:
    metadata:
      labels:
        app: investigation-agent
    spec:
      containers:
        - name: investigation-agent
          image: "{{ .Values.investigationAgent.image }}:{{ .Values.investigationAgent.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.investigationAgent.port }}
          env:
            - name: OKF_SHARED_ROOT
              value: "/app/knowledge/shared"
            - name: OKF_TENANT_ROOT
              value: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
            - name: INVESTIGATION_DATA_DIR
              value: {{ .Values.investigationAgent.agentRunPersistence.mountPath | quote }}
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: {{ .Values.investigationAgent.port }}
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.investigationAgent.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          volumeMounts:
            - name: agent-run-data
              mountPath: {{ .Values.investigationAgent.agentRunPersistence.mountPath | quote }}
          {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
            - name: okf-tenant-overlays
              mountPath: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
              readOnly: {{ .Values.investigationAgent.okfTenantOverlays.readOnly }}
          {{- end }}
      volumes:
        - name: agent-run-data
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.agentRunPersistence.existingClaim | default "investigation-agent-data" | quote }}
      {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
        - name: okf-tenant-overlays
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.okfTenantOverlays.existingClaim | quote }}
      {{- end }}
---
{{- if not .Values.investigationAgent.agentRunPersistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: investigation-agent-data
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.investigationAgent.agentRunPersistence.storageClassName }}
  storageClassName: {{ .Values.investigationAgent.agentRunPersistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.investigationAgent.agentRunPersistence.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: investigation-agent
spec:
  selector:
    app: investigation-agent
  ports:
    - port: {{ .Values.investigationAgent.port }}
      targetPort: {{ .Values.investigationAgent.port }}

