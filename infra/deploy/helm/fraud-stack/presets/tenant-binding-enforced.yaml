# Helm preset: enforce tenant binding on tenant-scoped API surfaces (Q1-E02).
# Merge with core-on-aws / full-on-k8s after API_KEY_TENANT_MAP is provisioned in appSecretsName.
#
#   helm upgrade tarka infra/deploy/helm/fraud-stack \
#     -f infra/deploy/helm/fraud-stack/presets/core-on-aws.yaml \
#     -f infra/deploy/helm/fraud-stack/presets/tenant-binding-enforced.yaml

global:
  environment: prod

coreApi:
  enabled: true
  allowInsecureNoAuth: false
  tenantBindingRequired: true
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    CASE_API_PRODUCTION_MODE: "true"
    SAR_TRANSPORT: "off"

integrationIngress:
  enabled: true
  tenantBindingRequired: true

graphService:
  enabled: true

dataPlane:
  enabled: true
  tenantBindingRequired: true
  extraEnv:
    INGEST_REQUIRE_IDEMPOTENCY_KEY: "true"
