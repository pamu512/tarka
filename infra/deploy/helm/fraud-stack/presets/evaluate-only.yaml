# Evaluate-only production path (thin HA): core-api on external stores.
# Graduated from the day-1 sketch — the in-cluster day-1 shape is plain
# chart defaults (`values.yaml` alone); this preset is the production-install
# grade path for CE-shaped buyers that only need evaluate.
#
# Generate with digest pins (mutable tags are NOT the grade path):
#   python3 infra/scripts/deploy/generate_cloud_values.py \
#     --preset evaluate-only \
#     --image-registry <registry>/tarka \
#     --db-url postgresql+asyncpg://user:pw@rds:5432/fraud \
#     --redis-url rediss://elasticache:6379/0 \
#     --digest-map /path/to/image-digests.map \
#     --output /tmp/evaluate-only.values.yaml
#   helm upgrade --install tarka infra/deploy/helm/fraud-stack \
#     -f /tmp/evaluate-only.values.yaml \
#     --set global.appSecretsName=tarka-app-secrets
#
# Required Secret keys in global.appSecretsName: API_KEYS,
# EVIDENCE_SIGNING_SECRET. Empty API_KEYS + empty OIDC issuer +
# allowInsecureNoAuth=false is fail-closed 503, not "no auth"
# (docs/contracts/production-install-v1.md).
#
# Frontend OFF is grade policy, not a gap: the desk is `make product`
# (compose) or enterprise-desk-on-k8s. Hunt/Advise/streams are off in this
# shape; empty plane URL = plane off.

global:
  environment: prod
  networkPolicy:
    enabled: true
  serviceMonitor:
    enabled: true
  imageRegistry: "__IMAGE_REGISTRY__"
  externalServices:
    postgres:
      enabled: true
      databaseUrl: "__DB_URL__"
    redis:
      enabled: true
      redisUrl: "__REDIS_URL__"

postgres:
  enabled: false
  auth:
    password: ""
redis:
  enabled: false
nats:
  enabled: false
clickhouse:
  enabled: false

coreApi:
  enabled: true
  tag: "1.3.0-beta"
  # Empty digest in this committed preset is a CI helm-template limitation.
  # Grade / publish: generate with --digest-map (enforced for this preset).
  digest: ""
  replicaCount: 2
  allowInsecureNoAuth: false
  tenantBindingRequired: true
  oidc:
    issuer: ""
    audience: "tarka"
    jwksUrl: ""
    rolesClaim: "roles"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    CASE_API_PRODUCTION_MODE: "true"
    SAR_TRANSPORT: "off"

signalApi:
  enabled: false
investigationAgent:
  enabled: false
integrationIngress:
  enabled: false
dataPlane:
  enabled: false
graphService:
  enabled: false
orchestrator:
  enabled: false

frontend:
  enabled: false
