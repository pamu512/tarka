global:
  environment: prod
  imageRegistry: "__IMAGE_REGISTRY__"

coreApi:
  enabled: true
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
signalApi:
  enabled: true
integrationIngress:
  enabled: true
graphService:
  enabled: true
investigationAgent:
  enabled: true
