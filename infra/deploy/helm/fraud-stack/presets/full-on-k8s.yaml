  enabled: true
graphqlGateway:
  enabled: true
frontend:
  enabled: true
opa:
  enabled: true

postgres:
  enabled: true
redis:
  enabled: true
neo4j:
  enabled: true
nats:
  enabled: true
clickhouse:
  enabled: true
