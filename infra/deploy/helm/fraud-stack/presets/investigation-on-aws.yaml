global:
  environment: prod
  imageRegistry: "__IMAGE_REGISTRY__"
  externalServices:
    postgres:
      enabled: true
      databaseUrl: "__DB_URL__"
    redis:
      enabled: true
      redisUrl: "__REDIS_URL__"

postgres:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: false
nats:
  enabled: false
clickhouse:
  enabled: false

coreApi:
  enabled: true
  replicaCount: 2
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    CASE_API_PRODUCTION_MODE: "true"
integrationIngress:
  enabled: true
investigationAgent:
  enabled: true
  dataPersistence:
    mode: postgres
  extraEnv:
    COPILOT_PRODUCTION_MODE: "true"
    COPILOT_REQUIRE_INVESTIGATION_API_KEY: "true"
    COPILOT_TRUSTED_SCOPE_HEADERS_REQUIRED: "true"
    COPILOT_INJECTION_POLICY: reject
    COPILOT_INCLUDE_PLATFORM_AUDIT_IN_PROMPT: "false"
graphqlGateway:
  enabled: true
frontend:
  enabled: true

dataPlane:
  extraEnv:
    INGEST_REQUIRE_IDEMPOTENCY_KEY: "true"

signalApi:
  enabled: true
graphService:
  enabled: false
