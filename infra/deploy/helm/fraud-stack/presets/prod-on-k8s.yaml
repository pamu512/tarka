# Large-org / VPC Helm overlay. Clone of core-on-aws plus HA knobs.
# In-cluster Postgres/Redis/ClickHouse stay off. Chart defaults (PDB/HPA off,
# tag: latest) are not production; this preset flips the knobs that already exist.
#
#   python3 infra/scripts/deploy/generate_cloud_values.py \
#     --preset prod-on-k8s \
#     --image-registry <registry>/tarka \
#     --db-url postgresql+asyncpg://user:pw@rds:5432/fraud \
#     --redis-url rediss://elasticache:6379/0 \
#     --output /tmp/prod-on-k8s.values.yaml
#   helm upgrade --install tarka infra/deploy/helm/fraud-stack \
#     -f /tmp/prod-on-k8s.values.yaml \
#     --set global.appSecretsName=tarka-app-secrets
#
# Required Secret keys in global.appSecretsName: API_KEYS (and optional
# EVIDENCE_SIGNING_SECRET, POSTGRES_PASSWORD). Empty API_KEYS + empty
# OIDC_ISSUER + ALLOW_INSECURE_NO_AUTH=false is 503, not "no auth".
# TARKA_DEPLOYMENT_PROFILE=production runs those fail-closed checks.
# OIDC is not a first-class values key — set issuer via extraEnv.
# Production profile does not require OIDC_ISSUER (API keys are the machine path).
# If OIDC_ISSUER is set, Redis must be resolved (same fail-closed rule as core-api).
# investigation-agent uses the already-required external Postgres (no new values keys).
# COPILOT_PRODUCTION_MODE is the same Python lock as compose production-hardening
# (API_KEYS required, no ALLOWED_ANALYSTS=*, LLM key required). ExtraEnv without that
# flag left /v1/chat reachable without service auth.

global:
  environment: prod
  imageRegistry: "__IMAGE_REGISTRY__"
  externalServices:
    postgres:
      enabled: true
      databaseUrl: "__DB_URL__"
    redis:
      enabled: true
      redisUrl: "__REDIS_URL__"

postgres:
  enabled: false
  auth:
    password: ""
redis:
  enabled: false
nats:
  enabled: false
clickhouse:
  enabled: false

coreApi:
  enabled: true
  tag: "1.3.0-beta"
  # Optional digest pin. Empty keeps the mutable tag so CI placeholders still
  # helm template. Operators should set a sha256 so the image cannot move:
  #   digest: "sha256:<64-hex>"
  digest: ""
  replicaCount: 2
  allowInsecureNoAuth: false
  tenantBindingRequired: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    OIDC_ISSUER: ""
    OIDC_AUDIENCE: "tarka"
    OIDC_JWKS_URL: ""
    OIDC_ROLES_CLAIM: "roles"

signalApi:
  enabled: true
  tag: "1.3.0-beta"
  # Optional digest pin (same as coreApi.digest). Empty is allowed for CI.
  digest: ""

investigationAgent:
  enabled: true
  tag: "1.3.0-beta"
  # Optional digest pin when this workload is enabled in prod.
  digest: ""
  replicaCount: 2
  dataPersistence:
    mode: postgres
  extraEnv:
    COPILOT_PRODUCTION_MODE: "true"
    COPILOT_REQUIRE_INVESTIGATION_API_KEY: "true"
    COPILOT_TRUSTED_SCOPE_HEADERS_REQUIRED: "true"
    COPILOT_INJECTION_POLICY: reject
    COPILOT_INCLUDE_PLATFORM_AUDIT_IN_PROMPT: "false"
integrationIngress:
  enabled: false
dataPlane:
  enabled: false
graphqlGateway:
  enabled: false
frontend:
  enabled: false
