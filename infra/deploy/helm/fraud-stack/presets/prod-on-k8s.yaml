# Large-org / VPC Helm overlay. Clone of core-on-aws plus HA knobs.
# In-cluster Postgres/Redis/ClickHouse stay off. Chart defaults (PDB/HPA off,
# tag: latest) are not production; this preset flips the knobs that already exist.
#
#   python3 infra/scripts/deploy/generate_cloud_values.py \
#     --preset prod-on-k8s \
#     --image-registry <registry>/tarka \
#     --db-url postgresql+asyncpg://user:pw@rds:5432/fraud \
#     --redis-url rediss://elasticache:6379/0 \
#     --digest-map /path/to/image-digests.map \
#     --output /tmp/prod-on-k8s.values.yaml
#   helm upgrade --install tarka infra/deploy/helm/fraud-stack \
#     -f /tmp/prod-on-k8s.values.yaml \
#     --set global.appSecretsName=tarka-app-secrets
#
# Required Secret keys in global.appSecretsName: API_KEYS,
# EVIDENCE_SIGNING_SECRET, RULE_GOVERNANCE_SECRET. Matrix:
# docs/contracts/production-install-v1.md. Empty API_KEYS + empty
# coreApi.oidc.issuer + ALLOW_INSECURE_NO_AUTH=false is 503, not "no auth".
# TARKA_DEPLOYMENT_PROFILE=production runs those fail-closed checks.
# Desk SSO is first-class: coreApi.oidc.{issuer,audience,jwksUrl,rolesClaim}
# (chart values.yaml is SoT — not extraEnv). Empty issuer = API-key machine path.
# Production does not require an issuer. Non-empty issuer requires resolved Redis
# (same fail-closed rule as core-api; no in-process OIDC state fallback).
# OIDC_CLIENT_ID stays extraEnv; OIDC_CLIENT_SECRET is the app-secrets key.
# investigation-agent uses the already-required external Postgres (no new values keys).
# COPILOT_PRODUCTION_MODE is the same Python lock as compose production-hardening
# (API_KEYS required, no ALLOWED_ANALYSTS=*, LLM key required). ExtraEnv without that
# flag left /v1/chat reachable without service auth.

global:
  environment: prod
  # Default-on: NetworkPolicy + ServiceMonitor. Mesh stays off.
  # Opt-out without dropping other prod fail-closes:
  #   --set global.networkPolicy.enabled=false --set global.serviceMonitor.enabled=false
  networkPolicy:
    enabled: true
  serviceMonitor:
    enabled: true
  imageRegistry: "__IMAGE_REGISTRY__"
  externalServices:
    postgres:
      enabled: true
      databaseUrl: "__DB_URL__"
    redis:
      enabled: true
      redisUrl: "__REDIS_URL__"

postgres:
  enabled: false
  auth:
    password: ""
redis:
  enabled: false
nats:
  enabled: false
clickhouse:
  enabled: false

coreApi:
  enabled: true
  tag: "1.3.0-beta"
  # Empty digest in this committed preset is a limitation so CI can
  # --allow-empty-digest and helm template placeholders. That is not an
  # immutable pin. Grade / publish: generate with --digest-map.
  digest: ""
  replicaCount: 2
  allowInsecureNoAuth: false
  tenantBindingRequired: true
  oidc:
    issuer: ""
    audience: "tarka"
    jwksUrl: ""
    rolesClaim: "roles"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    CASE_API_PRODUCTION_MODE: "true"
    SAR_TRANSPORT: "off"

signalApi:
  enabled: true
  tag: "1.3.0-beta"
  # Empty here is the same limitation as coreApi.digest. Grade generate --digest-map.
  digest: ""

# Operator must still set OPENAI_BASE_URL + OPENAI_API_KEY (extraEnv / secrets).
# Enabling without a BYO endpoint is chrome-only — prefer leave false.
investigationAgent:
  enabled: true
  tag: "1.3.0-beta"
  # Empty here is the same limitation as coreApi.digest. Grade generate --digest-map.
  digest: ""
  replicaCount: 2
  dataPersistence:
    mode: postgres
  extraEnv:
    COPILOT_PRODUCTION_MODE: "true"
    COPILOT_REQUIRE_INVESTIGATION_API_KEY: "true"
    COPILOT_TRUSTED_SCOPE_HEADERS_REQUIRED: "true"
    COPILOT_INJECTION_POLICY: reject
    COPILOT_INCLUDE_PLATFORM_AUDIT_IN_PROMPT: "false"
integrationIngress:
  enabled: false
dataPlane:
  enabled: false
graphqlGateway:
  enabled: false
frontend:
  enabled: false
