# Enterprise thin desk — buyer SoR Postgres + Redis, Tarka AGE Hunt sidecar.
# Split-plane: core-api DATABASE_URL is buyer RDS; graph-service uses agePostgres.
#
#   python3 infra/scripts/deploy/generate_cloud_values.py \
#     --preset enterprise-desk-on-k8s \
#     --image-registry <registry>/tarka \
#     --db-url postgresql+asyncpg://user:pw@rds:5432/fraud \
#     --redis-url rediss://elasticache:6379/0 \
#     --output /tmp/enterprise-desk.values.yaml
#   helm upgrade --install tarka infra/deploy/helm/fraud-stack \
#     -f /tmp/enterprise-desk.values.yaml \
#     --set global.appSecretsName=tarka-app-secrets
#
# Required Secret keys: API_KEYS, EVIDENCE_SIGNING_SECRET, RULE_GOVERNANCE_SECRET,
# AGE_POSTGRES_PASSWORD, AGE_DATABASE_URL (Hunt sidecar; not core SoR).
# Frontend image must be built with VITE_GRAPH_SERVICE_URL=/api/graph (Hunt on).
# Do not point DATABASE_URL at the age-postgres service (production_profile refuses).
# AGE Hunt backup: volume / filesystem restore only. Logical pg_dump breaks hops
# (catalog OIDs in graphids). Drill: scripts/oss/age_restore_drill.sh
# SoR (decisions/audit/packs/labels) is the buyer Postgres — see
# docs/docs/guides/production-backup-restore.md. Not a Tarka backup SaaS.
#
# Desk SSO: coreApi.oidc.{issuer,audience,jwksUrl,rolesClaim} (values.yaml SoT).
# Empty issuer = API-key machine path. Non-empty issuer requires resolved Redis.
# OIDC_CLIENT_ID via extraEnv; OIDC_CLIENT_SECRET on global.appSecretsName.
# rolesClaim strings are desk roles (RiskArchitect vs FraudAnalyst investigator)
# — no second policy language. Optional Promote maker-checker is install
# governance only (see deployment.md); RULE_FORCE_LIVE_TWO_PERSON is force-live.

global:
  environment: prod
  imageRegistry: "__IMAGE_REGISTRY__"
  externalServices:
    postgres:
      enabled: true
      databaseUrl: "__DB_URL__"
    redis:
      enabled: true
      redisUrl: "__REDIS_URL__"

postgres:
  enabled: false
  auth:
    password: ""
redis:
  enabled: false
nats:
  enabled: false
clickhouse:
  enabled: false

agePostgres:
  enabled: true
  image: apache/age:release_PG16_1.6.0
  auth:
    username: fraud
    # Literal password fraud is a chart-default leak. Prod render uses
    # secretKeyRef AGE_POSTGRES_PASSWORD / AGE_DATABASE_URL.
    password: ""
    database: fraud
  serviceName: age-postgres

coreApi:
  enabled: true
  tag: "1.3.0-beta"
  digest: ""
  replicaCount: 2
  allowInsecureNoAuth: false
  tenantBindingRequired: true
  oidc:
    issuer: ""
    audience: "tarka"
    jwksUrl: ""
    rolesClaim: "roles"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  extraEnv:
    TARKA_DEPLOYMENT_PROFILE: production
    TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
    CASE_API_PRODUCTION_MODE: "true"
    SAR_TRANSPORT: "off"
    RULE_FORCE_LIVE_TWO_PERSON: "1"
    DECISION_GRAPH_ENABLED: "true"

graphService:
  enabled: true
  tag: "1.3.0-beta"
  replicaCount: 2
  graphBackend: age
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  enabled: true
  tag: "1.3.0-beta"
  replicaCount: 2

signalApi:
  enabled: false
investigationAgent:
  enabled: false
integrationIngress:
  enabled: false
dataPlane:
  enabled: false
graphqlGateway:
  enabled: false
