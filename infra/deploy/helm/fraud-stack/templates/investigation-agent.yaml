{{- if .Values.investigationAgent.enabled }}
{{- if and .Values.investigationAgent.okfTenantOverlays.enabled (not .Values.investigationAgent.okfTenantOverlays.existingClaim) }}
{{- fail "investigation-agent OKF tenant overlays require investigationAgent.okfTenantOverlays.existingClaim" }}
{{- end }}
{{- if and (eq .Values.investigationAgent.agentRunPersistence.mode "local-sqlite") (gt (int .Values.investigationAgent.replicaCount) 1) }}
{{- fail "investigation-agent local-sqlite persistence requires a single replica; configure an external shared AgentRun store before scaling" }}
{{- end }}
{{- if ne .Values.investigationAgent.agentRunPersistence.mode "local-sqlite" }}
{{- fail "investigation-agent chart supports agentRunPersistence.mode=local-sqlite only; use an external shared AgentRun store deployment for horizontal scaling" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tarka.fullname" . }}-investigation-agent
spec:
  replicas: {{ .Values.investigationAgent.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "tarka.fullname" . }}-investigation-agent
  template:
    metadata:
      labels:
        app: {{ include "tarka.fullname" . }}-investigation-agent
    spec:
      containers:
        - name: investigation-agent
          image: {{ include "tarka.image" (dict "registry" .Values.global.imageRegistry "image" .Values.investigationAgent.image "tag" .Values.investigationAgent.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.investigationAgent.servicePort }}
          env:
            {{- if .Values.coreApi.enabled }}
            - name: CASE_API_URL
              value: "http://{{ include "tarka.fullname" . }}-core-api:{{ .Values.coreApi.servicePort }}/cases"
            - name: DECISION_API_URL
              value: "http://{{ include "tarka.fullname" . }}-core-api:{{ .Values.coreApi.servicePort }}/decisions"
            {{- end }}
            {{- if .Values.graphService.enabled }}
            - name: GRAPH_SERVICE_URL
              value: "http://{{ include "tarka.fullname" . }}-graph-service:8001"
            {{- end }}
            - name: AI_GOVERNANCE_PROFILE
              value: {{ .Values.investigationAgent.aiGovernanceProfile | default "global" | quote }}
            - name: OKF_SHARED_ROOT
              value: "/app/knowledge/shared"
            - name: OKF_TENANT_ROOT
              value: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
            - name: INVESTIGATION_DATA_DIR
              value: {{ .Values.investigationAgent.agentRunPersistence.mountPath | quote }}
            {{- if .Values.investigationAgent.batchTtlSeconds }}
            - name: BATCH_TTL_SECONDS
              value: {{ .Values.investigationAgent.batchTtlSeconds | quote }}
            {{- end }}
            {{- range $k, $v := .Values.investigationAgent.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: {{ .Values.investigationAgent.servicePort }}
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: agent-run-data
              mountPath: {{ .Values.investigationAgent.agentRunPersistence.mountPath | quote }}
          {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
            - name: okf-tenant-overlays
              mountPath: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
              readOnly: {{ .Values.investigationAgent.okfTenantOverlays.readOnly }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.investigationAgent.servicePort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
      volumes:
        - name: agent-run-data
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.agentRunPersistence.existingClaim | default (printf "%s-investigation-agent-data" (include "tarka.fullname" .)) | quote }}
      {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
        - name: okf-tenant-overlays
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.okfTenantOverlays.existingClaim | quote }}
      {{- end }}
---
{{- if not .Values.investigationAgent.agentRunPersistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-investigation-agent-data" (include "tarka.fullname" .) }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.investigationAgent.agentRunPersistence.storageClassName }}
  storageClassName: {{ .Values.investigationAgent.agentRunPersistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.investigationAgent.agentRunPersistence.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tarka.fullname" . }}-investigation-agent
spec:
  selector:
    app: {{ include "tarka.fullname" . }}-investigation-agent
  ports:
    - port: {{ .Values.investigationAgent.servicePort }}
      targetPort: {{ .Values.investigationAgent.servicePort }}
{{- end }}
