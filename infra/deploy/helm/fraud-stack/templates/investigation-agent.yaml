{{- if .Values.investigationAgent.enabled }}
{{- $persistMode := .Values.investigationAgent.dataPersistence.mode | default "local-sqlite" }}
{{- if and .Values.investigationAgent.okfTenantOverlays.enabled (not .Values.investigationAgent.okfTenantOverlays.existingClaim) }}
{{- fail "investigation-agent OKF tenant overlays require investigationAgent.okfTenantOverlays.existingClaim" }}
{{- end }}
{{- if and (eq $persistMode "local-sqlite") (gt (int .Values.investigationAgent.replicaCount) 1) }}
{{- fail "investigation-agent local-sqlite persistence requires a single replica; scale only after dataPersistence.mode=postgres (stores and batches)" }}
{{- end }}
{{- if not (or (eq $persistMode "local-sqlite") (eq $persistMode "postgres")) }}
{{- fail "investigation-agent dataPersistence.mode must be local-sqlite or postgres" }}
{{- end }}
{{- if eq $persistMode "postgres" }}
{{- $extPg := (((((.Values.global).externalServices).postgres) | default dict)) }}
{{- if and $extPg.enabled (or (eq (default "" $extPg.databaseUrl) "") (contains "__" (default "" $extPg.databaseUrl))) }}
{{- fail "investigation-agent dataPersistence.mode=postgres with external postgres requires global.externalServices.postgres.databaseUrl" }}
{{- end }}
{{- if and (not $extPg.enabled) (not .Values.postgres.enabled) }}
{{- fail "investigation-agent dataPersistence.mode=postgres requires postgres.enabled or global.externalServices.postgres.enabled" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tarka.fullname" . }}-investigation-agent
spec:
  strategy:
    type: {{ if eq $persistMode "postgres" }}RollingUpdate{{ else }}Recreate{{ end }}
  replicas: {{ .Values.investigationAgent.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "tarka.fullname" . }}-investigation-agent
  template:
    metadata:
      labels:
        app: {{ include "tarka.fullname" . }}-investigation-agent
    spec:
      containers:
        - name: investigation-agent
          image: {{ include "tarka.image" (dict "registry" .Values.global.imageRegistry "image" .Values.investigationAgent.image "tag" .Values.investigationAgent.tag "digest" .Values.investigationAgent.digest) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.investigationAgent.servicePort }}
          env:
            {{- if .Values.coreApi.enabled }}
            - name: CASE_API_URL
              value: "http://{{ include "tarka.fullname" . }}-core-api:{{ .Values.coreApi.servicePort }}/cases"
            - name: DECISION_API_URL
              value: "http://{{ include "tarka.fullname" . }}-core-api:{{ .Values.coreApi.servicePort }}/decisions"
            {{- end }}
            {{- if .Values.graphService.enabled }}
            - name: GRAPH_SERVICE_URL
              value: "http://{{ include "tarka.fullname" . }}-graph-service:8001"
            {{- end }}
            - name: AI_GOVERNANCE_PROFILE
              value: {{ .Values.investigationAgent.aiGovernanceProfile | default "global" | quote }}
            - name: OKF_SHARED_ROOT
              value: "/app/knowledge/shared"
            - name: OKF_TENANT_ROOT
              value: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
            - name: INVESTIGATION_DATA_DIR
              value: {{ .Values.investigationAgent.dataPersistence.mountPath | quote }}
            {{- if eq $persistMode "postgres" }}
            - name: INVESTIGATION_STORE
              value: "postgres"
            - name: DATABASE_URL
              {{- if .Values.global.externalServices.postgres.enabled }}
              value: {{ .Values.global.externalServices.postgres.databaseUrl | quote }}
              {{- else }}
              value: "postgresql+asyncpg://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password | default "fraud" }}@{{ include "tarka.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
              {{- end }}
            - name: INVESTIGATION_DATABASE_URL
              {{- if .Values.global.externalServices.postgres.enabled }}
              value: {{ .Values.global.externalServices.postgres.databaseUrl | quote }}
              {{- else }}
              value: "postgresql+asyncpg://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password | default "fraud" }}@{{ include "tarka.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
              {{- end }}
            {{- else }}
            - name: INVESTIGATION_STORE
              value: "sqlite"
            {{- end }}
            {{- if .Values.investigationAgent.batchTtlSeconds }}
            - name: BATCH_TTL_SECONDS
              value: {{ .Values.investigationAgent.batchTtlSeconds | quote }}
            {{- end }}
            {{- range $k, $v := .Values.investigationAgent.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.global.appSecretsName }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretsName | quote }}
                  key: API_KEYS
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretsName | quote }}
                  key: OPENAI_API_KEY
                  optional: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: {{ .Values.investigationAgent.servicePort }}
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: investigation-agent-data
              mountPath: {{ .Values.investigationAgent.dataPersistence.mountPath | quote }}
          {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
            - name: okf-tenant-overlays
              mountPath: {{ .Values.investigationAgent.okfTenantOverlays.mountPath | quote }}
              readOnly: {{ .Values.investigationAgent.okfTenantOverlays.readOnly }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.investigationAgent.servicePort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
      volumes:
        - name: investigation-agent-data
          {{- if eq $persistMode "postgres" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.dataPersistence.existingClaim | default (printf "%s-investigation-agent-data" (include "tarka.fullname" .)) | quote }}
          {{- end }}
      {{- if .Values.investigationAgent.okfTenantOverlays.enabled }}
        - name: okf-tenant-overlays
          persistentVolumeClaim:
            claimName: {{ .Values.investigationAgent.okfTenantOverlays.existingClaim | quote }}
      {{- end }}
---
{{- if and (eq $persistMode "local-sqlite") (not .Values.investigationAgent.dataPersistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-investigation-agent-data" (include "tarka.fullname" .) }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.investigationAgent.dataPersistence.storageClassName }}
  storageClassName: {{ .Values.investigationAgent.dataPersistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.investigationAgent.dataPersistence.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tarka.fullname" . }}-investigation-agent
  labels:
    app: {{ include "tarka.fullname" . }}-investigation-agent
spec:
  selector:
    app: {{ include "tarka.fullname" . }}-investigation-agent
  ports:
    - name: http
      port: {{ .Values.investigationAgent.servicePort }}
      targetPort: {{ .Values.investigationAgent.servicePort }}
{{- end }}
