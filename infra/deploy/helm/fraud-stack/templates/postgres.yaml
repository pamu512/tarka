{{- if .Values.postgres.enabled }}
{{- $isProd := eq (default "dev" .Values.global.environment) "prod" }}
{{- $persist := .Values.postgres.persistence | default dict }}
{{- $persistEnabled := default false $persist.enabled }}
{{- if and $isProd (not $persistEnabled) (not .Values.global.externalServices.postgres.enabled) }}
{{- fail "production requires postgres.persistence.enabled=true or global.externalServices.postgres.enabled=true" }}
{{- end }}
{{- if and $isProd (eq (default "fraud" .Values.postgres.auth.password) "fraud") (not .Values.global.appSecretsName) (not .Values.global.externalServices.postgres.enabled) }}
{{- fail "production must not use the default postgres password; set postgres.auth.password via secret or values" }}
{{- end }}
{{- if and $persistEnabled (not $persist.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tarka.fullname" . }}-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "20Gi" $persist.size | quote }}
  {{- if $persist.storageClassName }}
  storageClassName: {{ $persist.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tarka.fullname" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "tarka.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "tarka.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            {{- if .Values.global.appSecretsName }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretsName | quote }}
                  key: POSTGRES_PASSWORD
                  optional: true
            {{- else }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | default "fraud" | quote }}
            {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if $persistEnabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-postgres" (include "tarka.fullname" .)) $persist.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tarka.fullname" . }}-postgres
spec:
  selector:
    app: {{ include "tarka.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
