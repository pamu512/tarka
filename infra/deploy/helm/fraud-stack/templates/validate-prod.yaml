{{- /* Issuer-without-Redis leftover from 324/328: Python refuses start when
     TARKA_DEPLOYMENT_PROFILE=production and OIDC_ISSUER is set without REDIS_URL.
     Helm must fail the same way at render — including core-on-aws (environment=prod,
     PDB/HPA off) where the prod-on-k8s block below does not run. Empty OIDC_ISSUER
     stays valid (API keys remain the machine path). */ -}}
{{- $extraEnv := ((.Values.coreApi).extraEnv | default dict) }}
{{- $oidcIssuer := "" }}
{{- if hasKey $extraEnv "OIDC_ISSUER" }}
{{- $oidcIssuer = trim (toString (index $extraEnv "OIDC_ISSUER")) }}
{{- end }}
{{- $deployProfile := "" }}
{{- if hasKey $extraEnv "TARKA_DEPLOYMENT_PROFILE" }}
{{- $deployProfile = lower (trim (toString (index $extraEnv "TARKA_DEPLOYMENT_PROFILE"))) }}
{{- end }}
{{- $prodProfile := or (eq (default "dev" .Values.global.environment) "prod") (eq $deployProfile "production") }}
{{- if and $prodProfile (ne $oidcIssuer "") }}
{{- $redisResolved := "" }}
{{- if hasKey $extraEnv "REDIS_URL" }}
{{- $redisResolved = trim (toString (default "" (index $extraEnv "REDIS_URL"))) }}
{{- else }}
{{- $extRedisOidc := (((((.Values.global).externalServices).redis) | default dict)) }}
{{- if $extRedisOidc.enabled }}
{{- $redisResolved = trim (toString (default "" $extRedisOidc.redisUrl)) }}
{{- else if .Values.redis.enabled }}
{{- $redisResolved = "redis://in-cluster" }}
{{- end }}
{{- end }}
{{- if or (eq $redisResolved "") (contains "__" $redisResolved) }}
{{- fail "OIDC_ISSUER is set in production but REDIS_URL is missing or still a placeholder — Redis is required for desk SSO (no in-process OIDC state fallback)" }}
{{- end }}
{{- end }}
{{- /* Python production_profile already requires TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY
     when TARKA_DEPLOYMENT_PROFILE=production. Helm must fail the same way at render
     for environment=prod overlays that skip the prod-on-k8s PDB+HPA gate (core-on-aws). */ -}}
{{- if $prodProfile }}
{{- $idem := "" }}
{{- if hasKey $extraEnv "TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY" }}
{{- $idem = lower (trim (toString (index $extraEnv "TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY"))) }}
{{- end }}
{{- if not (or (eq $idem "true") (eq $idem "1") (eq $idem "yes") (eq $idem "on")) }}
{{- fail "TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY must be true in production (same fail-closed rule as production_profile)" }}
{{- end }}
{{- end }}
{{- /* Python case-api already fail-closes sqlite fallback and the default evidence HMAC
     when CASE_API_PRODUCTION_MODE is true. Compose production-hardening and Helm prod
     set TARKA_DEPLOYMENT_PROFILE on core-api (same process as case-api) but skipped this
     lock — postgres bootstrap failure still dropped cases onto case-api-dev.db. */ -}}
{{- if $prodProfile }}
{{- $caseProd := "" }}
{{- if hasKey $extraEnv "CASE_API_PRODUCTION_MODE" }}
{{- $caseProd = lower (trim (toString (index $extraEnv "CASE_API_PRODUCTION_MODE"))) }}
{{- end }}
{{- if not (or (eq $caseProd "true") (eq $caseProd "1") (eq $caseProd "yes") (eq $caseProd "on")) }}
{{- fail "CASE_API_PRODUCTION_MODE must be true in production (same fail-closed rule as case-api: no sqlite fallback, EVIDENCE_SIGNING_SECRET required)" }}
{{- end }}
{{- end }}
{{- /* Compose production-hardening already sets COPILOT_PRODUCTION_MODE so
     investigation-agent production_config fail-closes (API_KEYS, no ALLOWED_ANALYSTS=*,
     LLM key). Helm prod presets that enable the agent skipped that lock — /v1/chat
     stayed reachable without service auth. */ -}}
{{- if and $prodProfile .Values.investigationAgent.enabled }}
{{- $agentEnv := ((.Values.investigationAgent).extraEnv | default dict) }}
{{- $copilot := "" }}
{{- if hasKey $agentEnv "COPILOT_PRODUCTION_MODE" }}
{{- $copilot = lower (trim (toString (index $agentEnv "COPILOT_PRODUCTION_MODE"))) }}
{{- end }}
{{- if not (or (eq $copilot "true") (eq $copilot "1") (eq $copilot "yes") (eq $copilot "on")) }}
{{- fail "COPILOT_PRODUCTION_MODE must be true in production when investigation-agent is enabled (same fail-closed rule as production_config)" }}
{{- end }}
{{- end }}
{{- /* Compose production-hardening already sets INGEST_REQUIRE_IDEMPOTENCY_KEY so
     event-ingest fail-closes POST /v1/events without Idempotency-Key. Helm prod
     overlays that enable data-plane (full-on-k8s, investigation-on-aws default,
     tenant-binding-enforced) skipped that lock. */ -}}
{{- if and $prodProfile ((.Values.dataPlane).enabled) }}
{{- $ingestIdem := "" }}
{{- $dpExtra := ((.Values.dataPlane).extraEnv | default dict) }}
{{- if hasKey $dpExtra "INGEST_REQUIRE_IDEMPOTENCY_KEY" }}
{{- $ingestIdem = lower (trim (toString (index $dpExtra "INGEST_REQUIRE_IDEMPOTENCY_KEY"))) }}
{{- end }}
{{- if not (or (eq $ingestIdem "true") (eq $ingestIdem "1") (eq $ingestIdem "yes") (eq $ingestIdem "on")) }}
{{- fail "INGEST_REQUIRE_IDEMPOTENCY_KEY must be true in production when data-plane is enabled (same fail-closed rule as event-ingest / compose production-hardening)" }}
{{- end }}
{{- end }}
{{- /* Fail-closed for prod-on-k8s (environment=prod AND coreApi PDB+HPA on).
     core-on-aws also sets environment=prod but leaves PDB/HPA off and
     postgres.auth.password=fraud from chart defaults — do not fail that overlay. */ -}}
{{- $prodOnK8s := and (eq (default "dev" .Values.global.environment) "prod") ((.Values.coreApi).podDisruptionBudget).enabled ((.Values.coreApi).autoscaling).enabled }}
{{- if $prodOnK8s }}
{{- if .Values.postgres.enabled }}
{{- fail "global.environment=prod forbids in-cluster postgres (emptyDir + password fraud). Enable global.externalServices.postgres and disable postgres.enabled." }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- fail "global.environment=prod forbids in-cluster redis. Enable global.externalServices.redis and disable redis.enabled." }}
{{- end }}
{{- $extPg := (((((.Values.global).externalServices).postgres) | default dict)) }}
{{- if not $extPg.enabled }}
{{- fail "global.environment=prod requires global.externalServices.postgres.enabled" }}
{{- end }}
{{- $dbUrl := default "" $extPg.databaseUrl }}
{{- if or (eq $dbUrl "") (contains "__" $dbUrl) }}
{{- fail "global.environment=prod requires a resolved global.externalServices.postgres.databaseUrl (run generate_cloud_values.py)" }}
{{- end }}
{{- $extRedis := (((((.Values.global).externalServices).redis) | default dict)) }}
{{- if not $extRedis.enabled }}
{{- fail "global.environment=prod requires global.externalServices.redis.enabled" }}
{{- end }}
{{- $redisUrl := default "" $extRedis.redisUrl }}
{{- if or (eq $redisUrl "") (contains "__" $redisUrl) }}
{{- fail "global.environment=prod requires a resolved global.externalServices.redis.redisUrl" }}
{{- end }}
{{- $pw := default "" ((.Values.postgres.auth).password) }}
{{- if eq $pw "fraud" }}
{{- fail "global.environment=prod forbids leftover postgres.auth.password=fraud (chart default); set postgres.auth.password to empty when using external Postgres" }}
{{- end }}
{{- if ((.Values.coreApi).allowInsecureNoAuth) }}
{{- fail "global.environment=prod forbids coreApi.allowInsecureNoAuth" }}
{{- end }}
{{- $coreDigest := default "" ((.Values.coreApi).digest) }}
{{- if eq $coreDigest "latest" }}
{{- fail "global.environment=prod forbids coreApi.digest=latest — set a sha256 pin or leave digest empty and pin tag" }}
{{- end }}
{{- if not $coreDigest }}
{{- if eq (default "latest" .Values.coreApi.tag) "latest" }}
{{- fail "global.environment=prod forbids coreApi.tag=latest — pin a version (prod-on-k8s uses 1.3.0-beta) or set coreApi.digest" }}
{{- end }}
{{- end }}
{{- $signalDigest := default "" ((.Values.signalApi).digest) }}
{{- if and .Values.signalApi.enabled (eq $signalDigest "latest") }}
{{- fail "global.environment=prod forbids signalApi.digest=latest" }}
{{- end }}
{{- if and .Values.signalApi.enabled (not $signalDigest) (eq (default "latest" .Values.signalApi.tag) "latest") }}
{{- fail "global.environment=prod forbids signalApi.tag=latest" }}
{{- end }}
{{- $agentDigest := default "" ((.Values.investigationAgent).digest) }}
{{- if and .Values.investigationAgent.enabled (eq $agentDigest "latest") }}
{{- fail "global.environment=prod forbids investigationAgent.digest=latest" }}
{{- end }}
{{- if and .Values.investigationAgent.enabled (not $agentDigest) (eq (default "latest" .Values.investigationAgent.tag) "latest") }}
{{- fail "global.environment=prod forbids investigationAgent.tag=latest — pin a version (prod-on-k8s uses 1.3.0-beta)" }}
{{- end }}
{{- if and .Values.investigationAgent.enabled (ne ((.Values.investigationAgent.dataPersistence).mode | default "local-sqlite") "postgres") }}
{{- fail "global.environment=prod investigation-agent requires dataPersistence.mode=postgres (local-sqlite cannot HA)" }}
{{- end }}
{{- if eq (include "tarka.apiKeyTenantMapOptional" .) "true" }}
{{- fail "global.environment=prod forbids optional API_KEY_TENANT_MAP secretKeyRef" }}
{{- end }}
{{- if ((.Values.coreApi).apiKeyTenantMapOptional) }}
{{- fail "global.environment=prod forbids optional API_KEY_TENANT_MAP (coreApi.apiKeyTenantMapOptional)" }}
{{- end }}
{{- end }}
