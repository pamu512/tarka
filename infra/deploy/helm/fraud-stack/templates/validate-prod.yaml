{{- /* Fail-closed for prod-on-k8s (environment=prod AND coreApi PDB+HPA on).
     core-on-aws also sets environment=prod but leaves PDB/HPA off and
     postgres.auth.password=fraud from chart defaults — do not fail that overlay. */ -}}
{{- $prodOnK8s := and (eq (default "dev" .Values.global.environment) "prod") ((.Values.coreApi).podDisruptionBudget).enabled ((.Values.coreApi).autoscaling).enabled }}
{{- if $prodOnK8s }}
{{- if .Values.postgres.enabled }}
{{- fail "global.environment=prod forbids in-cluster postgres (emptyDir + password fraud). Enable global.externalServices.postgres and disable postgres.enabled." }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- fail "global.environment=prod forbids in-cluster redis. Enable global.externalServices.redis and disable redis.enabled." }}
{{- end }}
{{- $extPg := (((((.Values.global).externalServices).postgres) | default dict)) }}
{{- if not $extPg.enabled }}
{{- fail "global.environment=prod requires global.externalServices.postgres.enabled" }}
{{- end }}
{{- $dbUrl := default "" $extPg.databaseUrl }}
{{- if or (eq $dbUrl "") (contains "__" $dbUrl) }}
{{- fail "global.environment=prod requires a resolved global.externalServices.postgres.databaseUrl (run generate_cloud_values.py)" }}
{{- end }}
{{- $extRedis := (((((.Values.global).externalServices).redis) | default dict)) }}
{{- if not $extRedis.enabled }}
{{- fail "global.environment=prod requires global.externalServices.redis.enabled" }}
{{- end }}
{{- $redisUrl := default "" $extRedis.redisUrl }}
{{- if or (eq $redisUrl "") (contains "__" $redisUrl) }}
{{- fail "global.environment=prod requires a resolved global.externalServices.redis.redisUrl" }}
{{- end }}
{{- $pw := default "" ((.Values.postgres.auth).password) }}
{{- if eq $pw "fraud" }}
{{- fail "global.environment=prod forbids leftover postgres.auth.password=fraud (chart default); set postgres.auth.password to empty when using external Postgres" }}
{{- end }}
{{- if ((.Values.coreApi).allowInsecureNoAuth) }}
{{- fail "global.environment=prod forbids coreApi.allowInsecureNoAuth" }}
{{- end }}
{{- if eq (default "latest" .Values.coreApi.tag) "latest" }}
{{- fail "global.environment=prod forbids coreApi.tag=latest — pin a version (prod-on-k8s uses 1.3.0-beta)" }}
{{- end }}
{{- if and .Values.signalApi.enabled (eq (default "latest" .Values.signalApi.tag) "latest") }}
{{- fail "global.environment=prod forbids signalApi.tag=latest" }}
{{- end }}
{{- if .Values.investigationAgent.enabled }}
{{- if eq (default "latest" .Values.investigationAgent.tag) "latest" }}
{{- fail "global.environment=prod forbids investigationAgent.tag=latest — pin a version (prod-on-k8s uses 1.3.0-beta)" }}
{{- end }}
{{- if ne ((.Values.investigationAgent.dataPersistence).mode | default "local-sqlite") "postgres" }}
{{- fail "global.environment=prod investigation-agent requires dataPersistence.mode=postgres (local-sqlite cannot HA)" }}
{{- end }}
{{- end }}
{{- end }}
