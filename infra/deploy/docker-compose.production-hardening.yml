# Production-oriented hardening for Investigation Copilot (closes common OSS foot-guns).
# Use with base compose, e.g.:
#   docker compose -f infra/deploy/docker-compose.yml -f infra/deploy/docker-compose.production-hardening.yml --profile full up -d --build
#
# Before production: set API_KEYS and OPENAI_API_KEY via secrets manager — do not commit real keys.
# COPILOT_PRODUCTION_MODE=true fails fast at startup if misconfigured (see GET /v1/health production block).
# TARKA_DEPLOYMENT_PROFILE=production is the same Python lock as Helm prod (API_KEYS required at
# boot, no ALLOW_INSECURE_NO_AUTH, evaluate Idempotency-Key, wildcard tenant map refused, OIDC
# issuer requires Redis). Setting the individual knobs without the profile left those fail-closes off.

services:
  investigation-agent:
    environment:
      COPILOT_PRODUCTION_MODE: "true"
      COPILOT_REQUIRE_INVESTIGATION_API_KEY: "true"
      COPILOT_TRUSTED_SCOPE_HEADERS_REQUIRED: "true"
      COPILOT_INJECTION_POLICY: reject
      COPILOT_INCLUDE_PLATFORM_AUDIT_IN_PROMPT: "false"
      # Analyst allowlist (comma-separated); never use * in production:
      # ALLOWED_ANALYSTS: "analyst-a,analyst-b"
      COPILOT_RATE_LIMIT_PER_MINUTE: "120"
      COPILOT_MAX_REQUEST_BODY_BYTES: "8000000"
      # Set in shell / .env (required when COPILOT_PRODUCTION_MODE=true):
      # API_KEYS: "comma-separated-keys"

  core-api:
    environment:
      TARKA_DEPLOYMENT_PROFILE: production
      ALLOW_INSECURE_NO_AUTH: "false"
      TENANT_BINDING_REQUIRED: "true"
      TARKA_EVALUATE_REQUIRE_IDEMPOTENCY_KEY: "true"
      # Fraud spine Phase 2 — fail-closed catalog/freshness + CQRS lag budget on evaluate
      FEATURE_CATALOG_FAIL_CLOSED_EVENT_TYPES: "payment"
      GRAPH_RISK_FRESHNESS_DEFAULT_POLICY: "warn"
      GRAPH_RISK_FRESHNESS_POLICY_BY_EVENT: "payment:fail_closed,login:skip"
      ASYNC_ENRICH_MAX_AGE_MINUTES: "60"
      # Integrity baseline — soft tags always on; set REQUEST_SIGNATURE_SECRET to enforce HMAC on evaluate
      INTEGRITY_SOFT_TAGS: "true"
      REPLAY_PAYLOAD_TTL_SECONDS: "300"
      # REQUEST_SIGNATURE_SECRET: "${REQUEST_SIGNATURE_SECRET}"
      # REQUEST_SIGNATURE_MAX_SKEW_SECONDS: "300"
      # Challenge step-up webhook (tenant-owned; signed if secret set)
      # TARKA_CHALLENGE_WEBHOOK_URL: "https://example.com/hooks/tarka-challenge"
      # TARKA_CHALLENGE_WEBHOOK_SECRET: "${TARKA_CHALLENGE_WEBHOOK_SECRET}"
      # Platform enforcement webhook (allow|step_up|block) — tarka.enforcement/v1
      # TARKA_ENFORCEMENT_WEBHOOK_URL: "https://example.com/hooks/tarka-enforcement"
      # TARKA_ENFORCEMENT_WEBHOOK_SECRET: "${TARKA_ENFORCEMENT_WEBHOOK_SECRET}"

  integration-ingress:
    environment:
      TARKA_DEPLOYMENT_PROFILE: production
      TENANT_BINDING_REQUIRED: "true"

  graph-service:
    environment:
      TARKA_DEPLOYMENT_PROFILE: production
      TENANT_BINDING_REQUIRED: "true"

  data-plane:
    environment:
      TARKA_DEPLOYMENT_PROFILE: production
      TENANT_BINDING_REQUIRED: "true"
      INGEST_REQUIRE_IDEMPOTENCY_KEY: "true"

