server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Docker embedded DNS. Variable proxy_pass so optional upstreams (graph /
    # data-plane / orchestrator / graphql-gateway) are not resolved at nginx
    # start. investigation-agent is on desk. Missing host → 503 JSON, not SPA HTML.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/decisions/ {
        proxy_pass http://core-api:8000/decisions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cases/ {
        proxy_pass http://core-api:8000/cases/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/core/ {
        proxy_pass http://core-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ml/ {
        proxy_pass http://signal-api:8004/ml/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/features/ {
        proxy_pass http://signal-api:8004/features/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/signal-plane/ {
        proxy_pass http://signal-api:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ingress/ {
        proxy_pass http://integration-ingress:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/graph/ {
        set $tarka_optional graph-service:8001;
        proxy_pass http://$tarka_optional/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location /api/analytics/ {
        set $tarka_optional data-plane:8007;
        proxy_pass http://$tarka_optional/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location /api/ingest/ {
        set $tarka_optional data-plane:8007;
        proxy_pass http://$tarka_optional/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location /api/investigation/ {
        set $tarka_optional investigation-agent:8006;
        proxy_pass http://$tarka_optional/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location /api/collab/ {
        set $tarka_optional investigation-agent:8006;
        proxy_pass http://$tarka_optional/collab/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    # ingest profile. Same optional DNS as data-plane.
    location /api/orchestrator/ {
        set $tarka_optional orchestrator:8790;
        proxy_pass http://$tarka_optional/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location /api/v1/demo/ {
        set $tarka_optional orchestrator:8790;
        proxy_pass http://$tarka_optional/v1/demo/;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    # full / gateway profile. SPA no longer mounts Apollo; keep the hop honest.
    location /graphql {
        set $tarka_optional graphql-gateway:8010;
        proxy_pass http://$tarka_optional;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__tarka_upstream_unavailable;
    }

    location = /__tarka_upstream_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"upstream_unavailable"}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
