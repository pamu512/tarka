openapi: 3.1.0
info:
  title: Tarka Graph Service
  version: 1.0.0
  description: Entity graph boundary (Neo4j or alternate backend via same API).
servers:
  - url: http://localhost:8001
paths:
  /v1/health:
    get:
      operationId: graphHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /v1/entities:
    post:
      operationId: upsertEntity
      summary: Create or update a graph node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEntityRequest"
      responses:
        "200":
          description: Node id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
  /v1/links:
    post:
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /v1/subgraph:
    get:
      operationId: querySubgraph
      parameters:
        - name: entity_id
          in: query
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, default: 2, maximum: 5 }
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubgraphResponse"
  /v1/analytics/entity-risk:
    get:
      operationId: computeEntityRisk
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: entity_id
          in: query
          required: true
          schema: { type: string }
        - name: checkpoint
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Heuristic risk with optional gnn_beta section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRiskResponse"
  /v1/analytics/entity-risk/top:
    get:
      operationId: listEntityRiskTop
      summary: Ranked stored entity risk scores for a tenant
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
          description: Clamped to 1–200; out of range is clamped, not 400
        - name: min_score
          in: query
          required: false
          schema: { type: number, default: 0 }
      responses:
        "200":
          description: Scored entities ordered by risk_score DESC, external_id ASC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRiskTopResponse"
  /v1/analytics/entity-risk/refresh:
    post:
      operationId: refreshEntityRisk
      summary: Recompute and persist entity risk for one entity or a tenant scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRiskRefreshRequest"
      responses:
        "200":
          description: Persist counts; tenant scan also rewrites GraphRiskStats p90
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRiskRefreshResponse"
        "404":
          description: entity_id given but entity is not in the graph
  /v1/analytics/ring-suspicion:
    get:
      operationId: ringSuspicion
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: entity_id
          in: query
          required: true
          schema: { type: string }
        - name: min_ring_size
          in: query
          required: false
          schema: { type: integer, default: 3, minimum: 3, maximum: 6 }
      responses:
        "200":
          description: Mule/ring heuristic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingSuspicionResponse"
  /v1/analytics/path-explain:
    get:
      operationId: graphPathExplain
      summary: Ranked graph paths with risk narrative (Q2-E03)
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: from_entity_id
          in: query
          required: true
          schema: { type: string }
        - name: to_entity_id
          in: query
          required: false
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, default: 3, minimum: 1, maximum: 5 }
        - name: decay
          in: query
          schema: { type: number, default: 0.5 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 25 }
      responses:
        "200":
          description: Path explanation artifact
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/analytics/explainability/usage:
    get:
      operationId: graphExplainabilityUsage
      summary: Explainability surface usage counters since boot
      responses:
        "200":
          description: Usage snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/benchmark/datasets:
    get:
      operationId: graphBenchmarkDatasets
      summary: Curated graph-fraud benchmark tasks (DGFraud harness)
      responses:
        "200":
          description: Task catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/benchmark/features:
    get:
      operationId: graphBenchmarkFeatureRegistry
      summary: Graph feature registry export for decision pipelines
      responses:
        "200":
          description: Registry + content digest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/benchmark/runs:
    post:
      operationId: graphBenchmarkRunCreate
      summary: Run baseline vs graph-enhanced experiment scorecard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Scorecard artifact
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/benchmark/runs/{run_id}:
    get:
      operationId: graphBenchmarkRunGet
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored scorecard
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    UpsertEntityRequest:
      type: object
      required: [tenant_id, entity_type, external_id, properties]
      properties:
        tenant_id: { type: string }
        entity_type:
          type: string
          enum: [Person, Account, Device, Payment, Document, Custom]
        external_id: { type: string }
        properties:
          type: object
          additionalProperties: true
    EntityResponse:
      type: object
      properties:
        graph_id: { type: string }
        entity_type: { type: string }
        external_id: { type: string }
    LinkRequest:
      type: object
      required: [tenant_id, from_external_id, to_external_id, relationship]
      properties:
        tenant_id: { type: string }
        from_external_id: { type: string }
        to_external_id: { type: string }
        relationship:
          type: string
          enum: [USED, SHARED_WITH, REFERRED, KYC_VERIFIED_BY, OWNS, CUSTOM]
        properties:
          type: object
          additionalProperties: true
    SubgraphResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              labels: { type: array, items: { type: string } }
              properties: { type: object, additionalProperties: true }
        edges:
          type: array
          items:
            type: object
            properties:
              from_id: { type: string }
              to_id: { type: string }
              type: { type: string }
              properties: { type: object, additionalProperties: true }
    EntityRiskResponse:
      type: object
      properties:
        entity_id: { type: string }
        risk_score: { type: number }
        risk_factors:
          type: array
          items: { type: string }
        connected_flagged_count: { type: integer }
        community_size: { type: integer }
        neighbor_device_count:
          type: integer
          minimum: 0
          description: Distinct device_id values among 1-hop neighbors
        graph_checkpoint:
          type: string
          nullable: true
          description: Analytics profile name (minimal/standard/deep), not a timestamp
        graph_profile: { type: string, nullable: true }
        graph_profile_multiplier: { type: number, nullable: true }
        graph_profile_max_neighbor_hops: { type: integer, nullable: true }
        graph_data_as_of:
          type: string
          format: date-time
          nullable: true
          description: Latest graph vertex write time (UTC); used by decision-api freshness guard
        gnn_beta:
          type: object
          nullable: true
          additionalProperties: true
        scored:
          type: boolean
          default: false
          description: true when the entity exists and a score was computed (0 is a real score)
        relation_count:
          type: integer
          minimum: 0
          default: 0
        relation_growth_1h:
          type: integer
          minimum: 0
          default: 0
        relation_growth_24h:
          type: integer
          minimum: 0
          default: 0
    EntityRiskTopResponse:
      type: object
      required: [entities]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityRiskTopItem"
    EntityRiskTopItem:
      type: object
      properties:
        entity_id: { type: string }
        labels:
          type: array
          items: { type: string }
        risk_score: { type: number }
        risk_factors:
          type: array
          items: { type: string }
        risk_computed_at:
          type: string
          format: date-time
          nullable: true
        relation_count: { type: integer }
        relation_growth_1h: { type: integer }
        relation_growth_24h: { type: integer }
    EntityRiskRefreshRequest:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { type: string }
        entity_id:
          type: string
          description: If set, refresh this entity only (no GraphRiskStats rewrite)
        limit:
          type: integer
          default: 5000
          description: Tenant scan cap; clamped to 1–20000
    EntityRiskRefreshResponse:
      type: object
      required: [updated, skipped, truncated]
      properties:
        updated: { type: integer }
        skipped: { type: integer }
        truncated: { type: boolean }
    RingSuspicionResponse:
      type: object
      required: [tenant_id, entity_id, suspicion_level, score, reasons, ring_samples]
      properties:
        tenant_id: { type: string }
        entity_id: { type: string }
        suspicion_level:
          type: string
          enum: [low, medium, high]
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
        ring_samples:
          type: array
          items:
            type: object
            additionalProperties: true
